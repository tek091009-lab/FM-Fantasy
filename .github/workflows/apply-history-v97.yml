name: Apply history recovery v97
on:
  push:
    branches: [automation/history-v97]
    paths:
      - 'scripts/upgrade_history_global_constraint_v97.py'
      - '.github/workflows/apply-history-v97.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v97
        run: python scripts/upgrade_history_global_constraint_v97.py
      - name: Verify packed importer
        run: |
          python - <<'PY'
          import base64,gzip,re
          from pathlib import Path
          parts=[Path('app')/f'part{i:02d}' for i in range(17)]+[Path('app')/f'fix{i}' for i in range(17,21)]
          html=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts))).decode()
          m=re.search(r'const FM_PY_SOURCE_B64\s*=\s*"([^"]+)"',html);assert m
          py=base64.b64decode(m.group(1)).decode();compile(py,'fm_importer.py','exec')
          for s in ['def confirmed_roster_global_constraint_pass():','2<=len(uniq)<=8','if len(cs)!=len(fs):','perfect_matching(cs,(ci,fk))',"'unlabelled_retained_confirmed_roster_global_unique'",'g=confirmed_roster_global_constraint_pass()','unlabelled_rich_global_constraint_fixture_matches']:
              assert s in py,s
          # Preserve strict accumulated-roster and earlier conservative paths.
          assert 'shared<8 or repeated<4 or coverage<0.44' in py
          assert 'def confirmed_roster_one_side_pass():' in py
          assert 'if bool(lr)==bool(rr):continue' in py
          assert 'def confirmed_cohort_fixture_pass():' in py
          assert 'def single_side_bridge_pass():' in py
          # v97 must prove uniqueness by excluding every selected edge, not pick a best score.
          assert 'if perfect_matching(cs,(ci,fk)) is not None:' in py
          print('v97 packed importer verification passed')
          PY
      - name: Commit packed importer
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/part* app/fix*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply v97 globally unique retained fixture recovery'
          git push
