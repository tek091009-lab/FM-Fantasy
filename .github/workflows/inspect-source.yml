name: Inspect production structure
on:
  push:
    paths:
      - '.github/workflows/inspect-source.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode production bundle
        shell: bash
        run: |
          cat app/part00 app/part01 app/part02 app/part03 app/part04 app/part05 app/part06 app/part07 app/part08 app/part09 app/part10 app/part11 app/part12 app/part13 app/part14 app/part15 app/part16 app/fix17 app/fix18 app/fix19 app/fix20 | base64 -d | gzip -dc > /tmp/app.html
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/app.html').read_text(errors='replace')
          print('DECODED_LENGTH',len(s))
          needles=['Gameweek Chips','Combined points','Total Gameweeks','Average points','id="teamPage"','id="starPage"','id="starXIPage"','teamGrid','rightPanel','chipsPanel','pitchCard','starGrid','starSide','sidePanel']
          for n in needles:
              print('\n===== NEEDLE:',n,'=====')
              start=0; count=0
              while count<6:
                  i=s.find(n,start)
                  if i<0: break
                  a=max(0,i-1200); b=min(len(s),i+1800)
                  print(s[a:b].replace('\n',' '))
                  print('\n---')
                  start=i+len(n); count+=1
              if count==0: print('NO MATCH')
          print('\n===== PAGE ID / GRID CLASS CANDIDATES =====')
          import re
          for m in re.finditer(r'<[^>]+id=["\'](?:teamPage|star[^"\']*Page)["\'][^>]*>',s,re.I): print(m.group(0))
          print('\n===== CSS AROUND teamPage / starPage =====')
          for n in ['#teamPage','.teamGrid','#starPage','#starXIPage','.starGrid','.sideCard','.rightPanel']:
              print('\n###',n)
              for m in list(re.finditer(re.escape(n),s))[:8]:
                  print(s[max(0,m.start()-500):min(len(s),m.start()+1000)].replace('\n',' '))
          PY
