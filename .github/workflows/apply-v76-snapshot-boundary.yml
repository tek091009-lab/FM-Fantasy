name: Apply V76 snapshot boundary
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v76-snapshot-boundary.yml'
      - 'scripts/upgrade_snapshot_boundary_v76.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Apply V76 importer metadata
        run: python scripts/upgrade_snapshot_boundary_v76.py
      - name: Verify packed importer
        run: |
          python - <<'PY'
          import base64,gzip,re
          from pathlib import Path
          parts=[Path('app')/f'part{i:02d}' for i in range(17)]+[Path('app')/f'fix{i}' for i in range(17,21)]
          html=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts))).decode()
          m=re.search(r'const FM_PY_SOURCE_B64\s*=\s*"([^"]+)"',html);assert m
          py=base64.b64decode(m.group(1)).decode();compile(py,'fm_importer_v76.py','exec')
          for x in ['append-only-by-snapshot-date-v1',"'snapshot_date':snapshot_date",'v75-current-db-structural-senior-resolution-no-history']:
              assert x in py,x
          print('V75 + V76 packed importer verified')
          PY
      - name: Commit packed app
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/part* app/fix*
          git commit -m "Apply V76 dated append-only snapshot boundary"
          git push
