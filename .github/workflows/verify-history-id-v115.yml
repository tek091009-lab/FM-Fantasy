name: Verify retained-ID history recovery v115

on:
  push:
    branches: [automation/history-v100-fixture-conditioned-names]
    paths:
      - 'scripts/upgrade_history_confirmed_name_anchor_v99.py'
      - 'scripts/upgrade_history_name_transfer_support_v100.py'
      - 'scripts/upgrade_history_confirmed_name_one_side_v101.py'
      - 'scripts/upgrade_history_confirmed_name_global_constraint_v102.py'
      - 'scripts/upgrade_history_fixture_conditioned_name_pair_v103.py'
      - 'scripts/upgrade_history_fixture_conditioned_name_global_v104.py'
      - 'scripts/upgrade_history_canonical_name_alias_v105.py'
      - 'scripts/upgrade_history_confirmed_name_cohort_v106.py'
      - 'scripts/upgrade_history_accumulated_name_roster_v107.py'
      - 'scripts/upgrade_history_accumulated_name_roster_global_v108.py'
      - 'scripts/upgrade_history_transitive_name_cohort_graph_v109.py'
      - 'scripts/upgrade_history_transitive_name_pair_counter_v110.py'
      - 'scripts/upgrade_history_transitive_id_cohort_graph_v111.py'
      - 'scripts/upgrade_history_local_id_anchor_v112.py'
      - 'scripts/upgrade_history_fixture_conditioned_id_pair_v113.py'
      - 'scripts/upgrade_history_fixture_conditioned_id_global_v114.py'
      - 'scripts/upgrade_history_edge_trim_id_pair_v115.py'
      - '.github/workflows/verify-history-id-v115.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply retained history decoder stack
        run: |
          python scripts/upgrade_history_confirmed_name_anchor_v99.py
          python scripts/upgrade_history_name_transfer_support_v100.py
          python scripts/upgrade_history_confirmed_name_one_side_v101.py
          python scripts/upgrade_history_confirmed_name_global_constraint_v102.py
          python scripts/upgrade_history_fixture_conditioned_name_pair_v103.py
          python scripts/upgrade_history_fixture_conditioned_name_global_v104.py
          python scripts/upgrade_history_canonical_name_alias_v105.py
          python scripts/upgrade_history_confirmed_name_cohort_v106.py
          python scripts/upgrade_history_accumulated_name_roster_v107.py
          python scripts/upgrade_history_accumulated_name_roster_global_v108.py
          python scripts/upgrade_history_transitive_name_cohort_graph_v109.py
          python scripts/upgrade_history_transitive_name_pair_counter_v110.py
          python scripts/upgrade_history_transitive_id_cohort_graph_v111.py
          python scripts/upgrade_history_local_id_anchor_v112.py
          python scripts/upgrade_history_fixture_conditioned_id_pair_v113.py
          python scripts/upgrade_history_fixture_conditioned_id_global_v114.py
          python scripts/upgrade_history_edge_trim_id_pair_v115.py
      - name: Verify compiled importer and v115 safety invariants
        run: |
          python - <<'PY'
          import base64,gzip,re
          from pathlib import Path
          root=Path('.')
          parts=[root/'app'/f'part{i:02d}' for i in range(17)]+[root/'app'/f'fix{i}' for i in range(17,21)]
          html=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts))).decode()
          m=re.search(r'const FM_PY_SOURCE_B64\s*=\s*"([^"]+)"',html); assert m
          py=base64.b64decode(m.group(1)).decode(); compile(py,'fm_importer.py','exec')
          required=[
            'def confirmed_id_edge_trim_pair_pass():',
            "for cut_l,cut_r in ((0,0),(1,0),(0,1),(2,0),(1,1),(0,2)):",
            'if len(owners)==1 and target_eid in owners:',
            "(ls['trim']>0 or rs['trim']>0)",
            "register_match(ci,f,rev,leid,reid,'unlabelled_retained_confirmed_id_edge_trim_v115')",
            'e=confirmed_id_edge_trim_pair_pass()',
            'unlabelled_rich_confirmed_id_edge_trim_matches',
            'def confirmed_id_fixture_conditioned_global_pass():',
            'def confirmed_id_fixture_conditioned_pair_pass():',
          ]
          for s in required: assert s in py,s
          # Only boundary rows may be removed; there is no interior-row combinatorial deletion.
          assert "((0,0),(1,0),(0,1),(2,0),(1,1),(0,2))" in py
          # A uniquely proven target-club player can never be trimmed away.
          assert 'if len(owners)==1 and target_eid in owners:' in py
          # v115 is only a boundary-repair path: at least one side must actually require trimming.
          assert "(ls['trim']>0 or rs['trim']>0)" in py
          # Final attachment remains inside authoritative register_match.
          assert 'unlabelled_retained_confirmed_id_edge_trim_v115' in py
          print('v99-v115 stack compiles; v115 permits only bounded safe edge trimming plus unique exact-score fixture attachment')
          PY
