name: Apply history recovery v95
on:
  push:
    branches: [automation/history-v95]
    paths:
      - 'scripts/upgrade_history_confirmed_roster_v95.py'
      - '.github/workflows/apply-history-v95.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v95
        run: python scripts/upgrade_history_confirmed_roster_v95.py
      - name: Verify packed importer
        run: |
          python - <<'PY'
          import base64,gzip,re
          from pathlib import Path
          parts=[Path('app')/f'part{i:02d}' for i in range(17)]+[Path('app')/f'fix{i}' for i in range(17,21)]
          html=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts))).decode()
          m=re.search(r'const FM_PY_SOURCE_B64\s*=\s*"([^"]+)"',html);assert m
          py=base64.b64decode(m.group(1)).decode();compile(py,'fm_importer.py','exec')
          for s in ['def confirmed_roster_club(ids):','if len(cohorts)<2:continue','shared<8 or repeated<4 or coverage<0.44','def confirmed_roster_fixture_pass():',"'unlabelled_retained_confirmed_roster_fixture'",'r=confirmed_roster_fixture_pass()','unlabelled_rich_confirmed_roster_fixture_matches']:
              assert s in py,s
          assert 'def confirmed_cohort_fixture_pass():' in py
          print('v95 packed importer verification passed')
          PY
      - name: Commit packed importer
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/part* app/fix*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply v95 accumulated confirmed-roster history recovery'
          git push
