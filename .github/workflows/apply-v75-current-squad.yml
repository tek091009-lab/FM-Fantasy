name: Apply V75 current squad resolver
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v75-current-squad.yml'
      - 'scripts/upgrade_current_squad_structural_resolver_v75.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply packed importer V75
        run: python scripts/upgrade_current_squad_structural_resolver_v75.py
      - name: Verify V75 is packed
        run: |
          python - <<'PY'
          import base64,gzip,re
          from pathlib import Path
          root=Path('.')
          parts=[root/'app'/f'part{i:02d}' for i in range(17)]+[root/'app'/f'fix{i}' for i in range(17,21)]
          html=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts))).decode()
          m=re.search(r'const FM_PY_SOURCE_B64\s*=\s*"([^"]+)"',html); assert m
          py=base64.b64decode(m.group(1)).decode()
          compile(py,'fm_importer_v75.py','exec')
          for x in ['v75-current-db-structural-senior-resolution-no-history','_choose_current_squad_option_v75','paired_uid_v75','current_person_senior_quality_v75']:
              assert x in py,x
          assert 'Retained match/opponent evidence can add' not in py
          print('V75 packed importer verified')
          PY
      - name: Commit packed app
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/part* app/fix*
          git commit -m "Apply V75 structural current squad resolver"
          git push
