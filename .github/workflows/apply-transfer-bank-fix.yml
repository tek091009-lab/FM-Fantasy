name: Apply transfer bank fix
on:
  push:
    paths:
      - 'scripts/upgrade_transfer_bank_v63.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch production bundle
        run: python scripts/upgrade_transfer_bank_v63.py
      - name: Verify production invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip
          parts=[Path('app')/f'part{i:02d}' for i in range(17)]+[Path('app')/f'fix{i}' for i in range(17,21)]
          html=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts))).decode('utf-8')
          required=[
            'function fmRecalculateBank()',
            'const outs=locked.filter(id=>!now.has(id)).reduce((s,id)=>s+fmCurrentPrice(id),0)',
            'const ins=(state.squad||[]).filter(id=>!lockedSet.has(id)).reduce((s,id)=>s+fmCurrentPrice(id),0)',
            'state.bank=fmMoney(base+outs-ins)',
            'function addPlayer(id){fmRecalculateBank();const p=pby(id);if(p&&canAdd(p)){state.squad.push(id);fmRecalculateBank();save();renderAll()}}',
            'state.squad=state.squad.filter(x=>x!==id);fmRecalculateBank();',
            "state.squad=[];state.starters=[];state.bench=[];state.captain=null;state.vice=null;fmRecalculateBank();save();renderAll()",
            'fmRecalculateBank();refreshCompetitionUI();refreshClubFilters();save();renderAll();'
          ]
          missing=[x for x in required if x not in html]
          if missing: raise SystemExit('Missing invariants: '+repr(missing))
          # Rule examples: sell at CURRENT price, not purchase price.
          def bank(base, outs, ins): return round((base+sum(outs)-sum(ins))*10)/10
          assert bank(5.0,[10.2],[9.0]) == 6.2
          assert bank(5.0,[9.6],[9.0]) == 5.6
          assert bank(5.0,[10.2],[10.2]) == 5.0
          print('current-price transfer accounting invariants OK')
          PY
      - name: Commit production bundle
        shell: bash
        run: |
          if git diff --quiet -- app; then
            echo 'No production changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/part00 app/part01 app/part02 app/part03 app/part04 app/part05 app/part06 app/part07 app/part08 app/part09 app/part10 app/part11 app/part12 app/part13 app/part14 app/part15 app/part16 app/fix17 app/fix18 app/fix19 app/fix20
          git commit -m 'Fix transfer bank using current sell prices'
          git push
