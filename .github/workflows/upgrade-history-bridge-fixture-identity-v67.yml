name: Upgrade history bridge fixture identity v67
on:
  push:
    branches: [main]
    paths:
      - 'scripts/upgrade_history_bridge_fixture_identity_v67.py'
      - '.github/workflows/upgrade-history-bridge-fixture-identity-v67.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch embedded importer
        run: python scripts/upgrade_history_bridge_fixture_identity_v67.py
      - name: Verify generated importer
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path('scripts/history_recovery_v53.pyfrag').read_text()
          bad="uniq={int(o[0].get('fixture_id') or 0):(o) for o in options}"
          good="uniq={fixture_identity(o[0]):o for o in options}"
          assert bad not in s
          assert good in s
          assert 'def fixture_identity(f):' in s
          assert 'seen_side_pair_signatures' not in s
          assert 'if len(stats)<36:continue' in s
          print('v67 fixture identity checks passed')
          PY
      - name: Commit production upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/history_recovery_v53.pyfrag app/part* app/fix*
          git commit -m "Use canonical fixture identity in history bridge"
          git pull --rebase origin main
          git push origin HEAD:main
