name: Apply stable fixture identity v87

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/upgrade_stable_fixture_identity_v87.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v87 importer upgrade
        run: python scripts/upgrade_stable_fixture_identity_v87.py
      - name: Verify packed importer
        run: |
          python - <<'PY'
          import base64,gzip,re
          from pathlib import Path
          parts=[Path('app')/f'part{i:02d}' for i in range(17)]+[Path('app')/f'fix{i}' for i in range(17,21)]
          html=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts))).decode()
          m=re.search(r'const FM_PY_SOURCE_B64\s*=\s*"([^"]+)"',html);assert m
          py=base64.b64decode(m.group(1)).decode()
          compile(py,'fm_importer_v87.py','exec')
          for t in ['stable_fixture_key','ordered-team-pair-v87-stable-across-reschedule','refusing mutable schedule-based IDs']:
              assert t in py,t
          assert "sorted(fixtures,key=lambda x:(x['gameweek'],x['date'],x['home_tid'],x['away_tid']))" not in py
          print('v87 stable fixture identity verified')
          PY
      - name: Commit production chunks
        run: |
          if git diff --quiet -- app; then echo 'No changes'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          git commit -m 'Apply v87 stable fixture identity'
          git pull --rebase origin main
          git push origin HEAD:main
