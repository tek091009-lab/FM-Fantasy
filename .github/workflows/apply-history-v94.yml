name: Apply history recovery v94
on:
  push:
    branches: [automation/history-v94]
    paths:
      - 'scripts/upgrade_history_confirmed_fixture_v94.py'
      - '.github/workflows/apply-history-v94.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v94
        run: python scripts/upgrade_history_confirmed_fixture_v94.py
      - name: Verify packed importer
        run: |
          python - <<'PY'
          import base64,gzip,re
          from pathlib import Path
          root=Path('.')
          parts=[root/'app'/f'part{i:02d}' for i in range(17)]+[root/'app'/f'fix{i}' for i in range(17,21)]
          html=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts))).decode()
          m=re.search(r'const FM_PY_SOURCE_B64\s*=\s*"([^"]+)"',html);assert m
          py=base64.b64decode(m.group(1)).decode();compile(py,'fm_importer.py','exec')
          for s in ['def confirmed_cohort_fixture_pass():','lshared<7 or rshared<7','c=confirmed_cohort_fixture_pass()','unlabelled_rich_confirmed_cohort_fixture_matches']:
              assert s in py,s
          assert 'confirmed_side_cohorts=collections.defaultdict(list)' in py
          print('v94 packed importer verification passed')
          PY
      - name: Commit packed importer
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/part* app/fix*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply v94 direct confirmed-cohort fixture recovery'
          git push
