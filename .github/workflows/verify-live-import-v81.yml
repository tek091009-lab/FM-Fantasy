name: Verify live import V81
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-import-v81.yml'
      - 'scripts/test_partial_catchup_guard_v81.js'
      - 'index.html'
      - 'updateguard.js'
      - 'importcompat.js'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Test exact publish guard behavior
        run: node scripts/test_partial_catchup_guard_v81.js
      - name: Verify fresh live Pages build
        shell: bash
        run: |
          set -euo pipefail
          base='https://tek091009-lab.github.io/FM-Fantasy'
          ok=0
          for attempt in $(seq 1 48); do
            idx="$(curl -fsSL --max-time 20 "$base/index.html?verify=${GITHUB_SHA}-${attempt}" || true)"
            guard="$(curl -fsSL --max-time 20 "$base/updateguard.js?verify=${GITHUB_SHA}-${attempt}" || true)"
            compat="$(curl -fsSL --max-time 20 "$base/importcompat.js?verify=${GITHUB_SHA}-${attempt}" || true)"
            if printf '%s' "$idx" | grep -q 'importcompat.js?v=1' \
              && printf '%s' "$idx" | grep -q 'updateguard.js?v=6' \
              && printf '%s' "$guard" | grep -q 'world-update-guard-v6-structural-proof' \
              && printf '%s' "$compat" | grep -q 'retained-member-threshold-v81'; then
              : > /tmp/live_parts.b64
              good=1
              for i in $(seq -w 0 16); do curl -fsSL --max-time 20 "$base/app/part${i}?verify=${GITHUB_SHA}-${attempt}" >> /tmp/live_parts.b64 || good=0; done
              for i in 17 18 19 20; do curl -fsSL --max-time 20 "$base/app/fix${i}?verify=${GITHUB_SHA}-${attempt}" >> /tmp/live_parts.b64 || good=0; done
              if [ "$good" -eq 1 ] && tr -d '\r\n ' < /tmp/live_parts.b64 | base64 -d | gzip -dc > /tmp/live_app.html 2>/dev/null; then
                python - <<'PY'
          import base64,re
          html=open('/tmp/live_app.html',encoding='utf-8').read()
          m=re.search(r'const FM_PY_SOURCE_B64\s*=\s*"([^"]+)"',html);assert m
          py=base64.b64decode(m.group(1)).decode()
          compile(py,'live_importer.py','exec')
          assert 'if len(stats)<36:continue' in py
          assert 'range(18,23)' in py
          assert 'history_coverage_status' in html
          assert 'browser_build_payload_from_fs' in py
          print('live packed importer supports partial catch-up and 36-row retained members')
          PY
                ok=1;break
              fi
            fi
            sleep 5
          done
          [ "$ok" -eq 1 ] || { echo 'Live Pages never reached V81 import build' >&2; exit 1; }
      - name: Record verified live import build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy
          printf 'verified_live_sha=%s\nverified_at=%s\nupdate_guard=world-update-guard-v6-structural-proof\nretained_member_compat=retained-member-threshold-v81\ncatchup_partial_publish=verified\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .deploy/live-import-v81.txt
          git config user.name github-actions[bot]
          git config user.email 4189824+github-actions[bot]@users.noreply.github.com
          git add .deploy/live-import-v81.txt
          git commit -m "Record verified live V81 import build ${GITHUB_SHA::7}"
          git pull --rebase origin main
          git push
