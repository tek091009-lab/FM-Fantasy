name: Extract history recovery v94
on:
  push:
    branches: [automation/history-v94]
    paths:
      - 'scripts/extract_history_recovery_v94.py'
      - '.github/workflows/extract-history-v94.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/extract_history_recovery_v94.py
      - name: Commit extracted function
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/history_recovery_v94.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Extract current history recovery function v94'
          git push
