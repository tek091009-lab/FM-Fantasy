name: Align V79 roster guards
on:
  push:
    branches: [main]
    paths:
      - 'scripts/align_v79_roster_guards.py'
      - '.github/workflows/align-v79-roster-guards.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/align_v79_roster_guards.py
      - run: python scripts/final_preflight_v70.py
      - name: Commit aligned guards
        run: |
          set -e
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add updateguard.js index.html scripts/final_preflight_v70.py _preflight_v70.json
          git commit -m 'Align V79 roster guards and preflight' || exit 0
          git push
