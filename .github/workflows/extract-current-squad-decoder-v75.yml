name: Extract current squad decoder v75
on:
  push:
    paths:
      - 'scripts/extract_current_squad_decoder_v75.py'
      - '.github/workflows/extract-current-squad-decoder-v75.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/extract_current_squad_decoder_v75.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _current_squad_decoder_v75.txt
          git commit -m 'Record current squad decoder v75' || true
          git pull --rebase origin main
          git push
