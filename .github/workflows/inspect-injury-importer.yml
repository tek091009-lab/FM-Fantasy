name: Inspect FM availability importer
on:
  push:
    paths:
      - '.github/workflows/inspect-injury-importer.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode embedded Python importer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,re
          parts=[Path('app')/f'part{i:02d}' for i in range(17)]+[Path('app')/f'fix{i}' for i in range(17,21)]
          html=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts))).decode('utf-8')
          m=re.search(r'const FM_PY_SOURCE_B64\s*=\s*"([^"]+)"',html)
          if not m: raise SystemExit('FM_PY_SOURCE_B64 not found')
          py=base64.b64decode(m.group(1)).decode('utf-8'); lines=py.splitlines()
          needles=['def browser_build_payload_from_fs','recover_unlabelled_rich_members(','join_rich_matches(','infer_hybrid_positions_from_match_markers(','reprice_players(','injury.dat','injured_players','injury_status','injury_evidence_structural','discipline.dat','suspended_players']
          seen=set()
          for needle in needles:
              print('\n===== '+needle+' =====')
              for i,l in enumerate(lines):
                  if needle.lower() not in l.lower(): continue
                  a=max(0,i-18);b=min(len(lines),i+35);key=(a,b)
                  if key in seen: continue
                  seen.add(key)
                  for j in range(a,b): print(f'{j+1:05d}: {lines[j]}')
                  print('---')
          PY
