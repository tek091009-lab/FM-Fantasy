# verify structural availability v2 from the current production bundle
name: Audit injury source
on:
  push:
    paths:
      - '.github/workflows/audit-injury-source.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode exact structural availability function
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,re
          parts=[Path('app')/f'part{i:02d}' for i in range(17)]+[Path('app')/f'fix{i}' for i in range(17,21)]
          html=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts))).decode('utf-8')
          m=re.search(r'const FM_PY_SOURCE_B64\s*=\s*"([^"]+)"',html)
          if not m: raise SystemExit('FM_PY_SOURCE_B64 not found')
          py=base64.b64decode(m.group(1)).decode('utf-8')
          start=py.find('def _structural_availability_from_fs')
          if start<0: raise SystemExit('structural availability function missing')
          nxt=py.find('\ndef ',start+10)
          if nxt<0:nxt=len(py)
          out=py[start:nxt]
          for token in ['structural-v2-fixture-floor','fixture_floor','full<=save_date','expiry<=save_date']:
              if token not in out: raise SystemExit('missing '+token)
          Path('_injury_source_audit.txt').write_text(out,encoding='utf-8')
          print('structural availability v2 production audit passed')
          PY
      - name: Commit audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _injury_source_audit.txt
          git commit -m 'Verify structural availability v2 source' || exit 0
          git push
