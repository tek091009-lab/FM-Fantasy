name: Core integrity regression gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [automation/history-source-restoration-v174]
    paths:
      - 'scripts/upgrade_history_restore_retained_sources_v174.py'
      - '.github/workflows/apply-history-source-restoration-v174.yml'
      - '.github/workflows/core-integrity.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run full core regressions
        run: |
          set -euo pipefail
          node scripts/test_season_publish_v84.js
          node scripts/test_squad_registration_policy_v3.js
          node scripts/test_news_persistence_v7.js
          node scripts/test_news_refresh_manager_state_v8.js
          node scripts/test_core_integrity_v33.js
          node scripts/test_transfer_draft_survives_restore_v37.js
          node scripts/test_initial_squad_builder_survives_restore_v38.js
          node scripts/test_team_management_survives_restore_v39.js
          node scripts/test_news_transfer_stability_v40.js
          node scripts/test_news_persistence_canonical_dom_v41.js
          if [ -f scripts/test_weekly_boundary_v12.js ]; then node scripts/test_weekly_boundary_v12.js; fi
          python scripts/test_news_aesthetic_v34.py
          node scripts/test_news_parent_layout_v35.js
      - name: Syntax check runtime guards
        run: |
          set -euo pipefail
          node --check sessionrpcbridge.js
          node --check publishscorebarrier.js
          node --check transferintegrityguard.js
          node --check transferrolloverguard.js
          node --check managerauthoritative.js
          node --check servermanagerscoreclientv1.js
          node --check managerstateauthorityv1.js
          node --check newspersistencev5.js
          node --check newsworldrecovery.js
          node --check newsaestheticv34.js
          node --check newstransferstabilityv40.js
      - name: Verify packed importer compiles
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,re
          parts=[Path('app')/f'part{i:02d}' for i in range(17)]+[Path('app')/f'fix{i}' for i in range(17,21)]
          html=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts))).decode('utf-8')
          m=re.search(r'const FM_PY_SOURCE_B64\s*=\s*"([^"]+)"',html); assert m,'embedded importer missing'
          py=base64.b64decode(m.group(1)).decode('utf-8'); compile(py,'live_importer.py','exec')
          assert 'browser_build_payload_from_fs' in py
          print('packed importer compiles')
          PY
      - name: Verify source-controlled live migrations
        run: |
          set -euo pipefail
          grep -q 'v_old_player_map' supabase/migrations/20260821165913_optimize_locked_history_merge_v2.sql
          grep -q 'v_locked_count' supabase/migrations/20260821170136_repair_confirmed_team_transfer_baseline_v1.sql
          grep -q 'server-authoritative-manager-scoring-v2' supabase/migrations/20260821165500_manager_scoring_v2_entry_ft_and_league_identity.sql
      - name: Apply focused v174 retained-history source restoration
        if: (github.event_name == 'push' && github.ref_name == 'automation/history-source-restoration-v174') || (github.event_name == 'pull_request' && github.head_ref == 'automation/history-source-restoration-v174')
        run: |
          set -euo pipefail
          python scripts/upgrade_history_restore_retained_sources_v174.py
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,re
          parts=[Path('app')/f'part{i:02d}' for i in range(17)]+[Path('app')/f'fix{i}' for i in range(17,21)]
          html=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts))).decode('utf-8')
          m=re.search(r'const FM_PY_SOURCE_B64\s*=\s*"([^"]+)"',html); assert m
          py=base64.b64decode(m.group(1)).decode('utf-8'); compile(py,'fm_importer.py','exec')
          assert "_RICH_SOURCE_RESTORATION_V174" in py
          assert "structural-scan-only-no-source-trust" in py
          pos=py.find('unlabelled_rich_non_retained_member_names'); assert pos >= 0
          fs=py.rfind('\ndef ',0,pos); fs=fs+1 if fs>=0 else py.rfind('def ',0,pos)
          fe=py.find('\ndef ',pos); fe=len(py) if fe<0 else fe
          block=py[fs:fe]
          for member in ('player_stats.dat','play_fixture_manager.dat','news.dat'):
              assert member not in block, member
          assert 'register_match' in py and 'fixture_identity' in py and 'def _rich_stat_record_at' in py
          print('v174 packed importer verified')
          PY
      - name: Commit packed v174 importer to research branch
        if: (github.event_name == 'push' && github.ref_name == 'automation/history-source-restoration-v174') || (github.event_name == 'pull_request' && github.head_ref == 'automation/history-source-restoration-v174')
        run: |
          set -euo pipefail
          if git diff --quiet -- app; then
            echo 'No packed importer changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '4189823+github-actions[bot]@users.noreply.github.com'
          git add app
          git commit -m 'Apply retained history source restoration v174'
          git push origin HEAD:automation/history-source-restoration-v174
