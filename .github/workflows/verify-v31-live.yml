name: Verify V31 live
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check V31 News bridge syntax
        run: node --check newsdiffbridge.js
      - name: Wait for V31 on public Pages
        shell: bash
        run: |
          set -euo pipefail
          base='https://tek091009-lab.github.io/FM-Fantasy'
          ok=0
          for attempt in $(seq 1 60); do
            stamp="${GITHUB_SHA}-${attempt}-$(date +%s)"
            idx="$(curl -fsSL --max-time 20 "$base/index.html?v=$stamp" || true)"
            news="$(curl -fsSL --max-time 20 "$base/newsdiffbridge.js?v=$stamp" || true)"
            if printf '%s' "$idx" | grep -q 'fm-deploy-v31-server-scored-public-transfer-news' \
              && printf '%s' "$idx" | grep -q 'newsdiffbridge.js?v=4' \
              && printf '%s' "$news" | grep -q 'news-diff-bridge-v4-public-readonly-rpc' \
              && printf '%s' "$news" | grep -q 'fmfantasy_last_import_news_diff_public'; then
              ok=1
              break
            fi
            sleep 5
          done
          [ "$ok" -eq 1 ] || { echo 'V31 did not become live' >&2; exit 1; }
      - name: Record verified V31
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v31
          cat > /tmp/v31/live.json <<JSON
          {
            "verified_live_sha": "${GITHUB_SHA}",
            "verified_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "version": "v31-server-scored-public-transfer-news",
            "manager_server_state": "Kian 66; TKFantasy 30 already applied by server authoritative scorer",
            "transfer_news": "24-event last successful import diff via public read-only RPC",
            "future_transfer_news": "server BEFORE-update canonical transfer-news trigger v1"
          }
          JSON
          content="$(base64 -w0 /tmp/v31/live.json)"
          old="$(gh api repos/${GITHUB_REPOSITORY}/contents/.deploy/v31-live.json?ref=main --jq .sha 2>/dev/null || true)"
          if [ -n "$old" ]; then
            gh api --method PUT repos/${GITHUB_REPOSITORY}/contents/.deploy/v31-live.json -f message="Record verified V31 live" -f content="$content" -f sha="$old" -f branch=main >/dev/null
          else
            gh api --method PUT repos/${GITHUB_REPOSITORY}/contents/.deploy/v31-live.json -f message="Record verified V31 live" -f content="$content" -f branch=main >/dev/null
          fi
