name: Normalize retained history candidates
on:
  push:
    branches: [main]
    paths:
      - 'scripts/upgrade_history_decoder_v59.py'
      - '.github/workflows/upgrade-history-candidate-normalization-v59.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch embedded importer
        run: python scripts/upgrade_history_decoder_v59.py
      - name: Verify generated importer
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path('scripts/history_recovery_v53.pyfrag').read_text()
          assert "near_duplicate_candidate_pairs_collapsed" in s
          assert "pair_key=tuple(sorted((lids,rids)))" in s
          assert "abs(start-ps)<=2048" in s
          assert "def fixture_identity(f):" in s
          assert "fixture_identity(f) in used_fixtures" in s
          assert "adaptive_cluster_edges" in s
          assert "transfer_conflict_neutralized_players" in s
          print('v59 candidate-normalization checks passed')
          PY
      - name: Commit production upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/history_recovery_v53.pyfrag app/part* app/fix*
          git commit -m "Normalize retained history candidates"
          git push origin HEAD:main
