name: Diagnose league selector v72
on:
  push:
    paths:
      - 'scripts/diagnose_league_selector_v72.py'
      - '.github/workflows/diagnose-league-selector-v72.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/diagnose_league_selector_v72.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _league_selector_diag.txt
          git commit -m 'Record V72 league selector diagnostic' || exit 0
          git pull --rebase origin main
          git push
