name: Diagnose league selector v72
on:
  push:
    paths:
      - 'scripts/diagnose_league_selector_v72.py'
      - 'scripts/extract_fixture_selector_v73.py'
      - 'scripts/compare_old_fixture_mapping_v73.py'
      - '.github/workflows/diagnose-league-selector-v72.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/diagnose_league_selector_v72.py
      - run: python scripts/extract_fixture_selector_v73.py
      - run: python scripts/compare_old_fixture_mapping_v73.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _league_selector_diag.txt _fixture_selector_v73.txt _old_fixture_mapping_v73.txt
          git commit -m 'Record old and current fixture selector diagnostic' || exit 0
          git pull --rebase origin main
          git push
