name: Apply V80 retained fixture identity
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-retained-fixture-identity-v80.yml'
      - 'scripts/upgrade_retained_fixture_identity_v79.py'
      - 'scripts/upgrade_retained_fixture_identity_v80.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Apply V79 retained representation safeguards
        run: python scripts/upgrade_retained_fixture_identity_v79.py
      - name: Apply V80 canonical fixture quarantine identity
        run: python scripts/upgrade_retained_fixture_identity_v80.py
      - name: Verify packed importer
        run: |
          python - <<'PY'
          import base64,gzip,re
          from pathlib import Path
          parts=[Path('app')/f'part{i:02d}' for i in range(17)]+[Path('app')/f'fix{i}' for i in range(17,21)]
          html=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts))).decode()
          m=re.search(r'const FM_PY_SOURCE_B64\s*=\s*"([^"]+)"',html);assert m
          py=base64.b64decode(m.group(1)).decode();compile(py,'fm_importer_v80.py','exec')
          required=['V79: de-duplicate only byte-local duplicate label representations.',
                    'V80: use canonical schema-safe fixture identity for final retained',
                    'fid=fixture_identity(fix)',
                    "'fixture_identity_policy':'canonical_id_or_structural_v80'",
                    'append-only-by-snapshot-date-v1']
          for x in required: assert x in py,x
          assert "fid=int(fix['fixture_id'])" not in py
          print('V80 packed importer verified')
          PY
      - name: Commit packed app
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 4189824+github-actions[bot]@users.noreply.github.com
          git add app/part* app/fix*
          git commit -m "Apply V80 retained fixture identity safeguards"
          git pull --rebase origin main
          git push
