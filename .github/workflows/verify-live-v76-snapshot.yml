name: Verify live V81 importer shell
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-v76-snapshot.yml'
      - 'index.html'
      - 'updateguard.js'
      - 'importcompat.js'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact live Pages importer shell
        shell: bash
        run: |
          set -euo pipefail
          base='https://tek091009-lab.github.io/FM-Fantasy'
          ok=0
          for attempt in $(seq 1 36); do
            idx="$(curl -fsSL --max-time 20 "$base/index.html?verify=${GITHUB_SHA}-${attempt}" || true)"
            guard="$(curl -fsSL --max-time 20 "$base/updateguard.js?verify=${GITHUB_SHA}-${attempt}" || true)"
            compat="$(curl -fsSL --max-time 20 "$base/importcompat.js?verify=${GITHUB_SHA}-${attempt}" || true)"
            if printf '%s' "$idx" | grep -q 'importcompat.js?v=1' \
              && printf '%s' "$idx" | grep -q 'updateguard.js?v=6' \
              && printf '%s' "$guard" | grep -q 'world-update-guard-v6-structural-proof' \
              && printf '%s' "$compat" | grep -q 'retained-member-threshold-v81'; then
              ok=1;break
            fi
            sleep 5
          done
          [ "$ok" -eq 1 ] || { echo 'Live Pages importer shell did not reach V81' >&2; exit 1; }
      - name: Record verified live import shell
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy
          printf 'verified_live_sha=%s\nverified_at=%s\nupdate_guard=world-update-guard-v6-structural-proof\nretained_member_compat=retained-member-threshold-v81\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .deploy/live-import-v81.txt
          git config user.name github-actions[bot]
          git config user.email 4189824+github-actions[bot]@users.noreply.github.com
          git add .deploy/live-import-v81.txt
          git commit -m "Record verified live importer shell ${GITHUB_SHA::7}"
          git pull --rebase origin main
          git push
