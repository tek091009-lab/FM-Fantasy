# normalize the direct-evidence core availability block exactly once
name: Apply core availability truth
on:
  push:
    paths:
      - '.github/workflows/apply-core-availability-truth.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply core availability patch
        run: python scripts/upgrade_core_availability_truth.py
      - name: Verify decoded core
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,gzip
          parts=[Path('app')/f'part{i:02d}' for i in range(17)]+[Path('app')/f'fix{i}' for i in range(17,21)]
          html=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts))).decode('utf-8')
          start=html.find('function fmAvailabilityTruthDate')
          end=html.find('function fmBuildInitialNews(payload){',start)
          assert start>=0 and end>start
          block=html[start:end]
          for t in ['fmAvailabilityTruthStale','discipline.dat/active-ban-v1','injury_manager.dat/current-window']:
              assert t in block,t
          for bad in ['5 yellow cards','second-yellow red','fmClubPlayedAfter(payload,p.club,inc.date)']:
              assert bad not in block,bad
          for d in ['function fmAvailabilityTruthDate(payload){','function fmAvailabilityTruthStale(payload){','function fmInferActiveSuspensions(payload){','function fmInferActiveInjuries(payload){']:
              assert html.count(d)==1,(d,html.count(d))
          print('core direct-evidence availability truth verified exactly once')
          PY
      - name: Commit production bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/part00 app/part01 app/part02 app/part03 app/part04 app/part05 app/part06 app/part07 app/part08 app/part09 app/part10 app/part11 app/part12 app/part13 app/part14 app/part15 app/part16 app/fix17 app/fix18 app/fix19 app/fix20
          git commit -m 'Normalize core direct-evidence availability truth' || exit 0
          git push
