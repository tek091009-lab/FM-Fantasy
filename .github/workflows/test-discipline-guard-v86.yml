name: Test discipline guard v86
on:
  pull_request:
    paths:
      - 'disciplineguardv86pre.js'
      - 'disciplineguardv86post.js'
      - 'availabilitytruth.js'
      - 'index.html'
      - 'scripts/test_discipline_guard_v86.js'
      - '.github/workflows/test-discipline-guard-v86.yml'
jobs:
  discipline-guard-v86:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression test
        run: node scripts/test_discipline_guard_v86.js
      - name: Verify loader order and selected-league truth
        run: |
          python - <<'PY'
          from pathlib import Path
          idx=Path('index.html').read_text()
          pre=idx.index('./disciplineguardv86pre.js?v=1')
          model=idx.index('./importmodelv85.js?v=2')
          post=idx.index('./disciplineguardv86post.js?v=2')
          assert pre < model < post
          assert './availabilitytruth.js?v=8' in idx
          truth=Path('availabilitytruth.js').read_text()
          assert "selected_competition_history_v85" in truth
          assert "competition_scope" in truth
          assert "availability-truth-v8-selected-league-discipline" in truth
          guard=Path('disciplineguardv86post.js').read_text()
          assert 'discipline-guard-v87-selected-league-authority' in guard
          assert 'diagnostic_only_unscoped_competition_v87' in guard
          assert 'selected_competition_history_v85' in guard
          print('v87 loader/selected-league assertions OK')
          PY
