name: Test discipline guard v86
on:
  pull_request:
    paths:
      - 'disciplineguardv86pre.js'
      - 'disciplineguardv86post.js'
      - 'availabilitytruth.js'
      - 'index.html'
      - 'scripts/test_discipline_guard_v86.js'
      - '.github/workflows/test-discipline-guard-v86.yml'
jobs:
  discipline-guard-v86:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression test
        run: node scripts/test_discipline_guard_v86.js
      - name: Verify loader order and direct-ban truth
        run: |
          python - <<'PY'
          from pathlib import Path
          idx=Path('index.html').read_text()
          pre=idx.index('./disciplineguardv86pre.js?v=1')
          model=idx.index('./importmodelv85.js?v=1')
          post=idx.index('./disciplineguardv86post.js?v=1')
          assert pre < model < post
          assert './availabilitytruth.js?v=7' in idx
          truth=Path('availabilitytruth.js').read_text()
          assert "src!=='discipline.dat/active-ban-v1'" in truth
          assert "selected_competition_history_v85" not in truth
          guard=Path('disciplineguardv86post.js').read_text()
          assert 'diagnostic_only_not_current_state_v86' in guard
          print('v86 loader/direct-ban assertions OK')
          PY
