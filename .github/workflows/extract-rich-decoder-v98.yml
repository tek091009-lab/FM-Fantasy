name: Extract current rich decoder v98
on:
  push:
    branches: [main]
    paths:
      - 'scripts/extract_current_rich_decoder_v98.py'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/extract_current_rich_decoder_v98.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _current_rich_decoder_v98.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Extract current rich decoder v98 snapshot'
          git push
