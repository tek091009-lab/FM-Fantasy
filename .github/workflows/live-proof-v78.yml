name: Live proof v78
on:
  push:
    paths:
      - '.github/workflows/live-proof-v78.yml'
permissions:
  contents: write
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch live packed app
        run: |
          set -euo pipefail
          base='https://tek091009-lab.github.io/FM-Fantasy'
          : > /tmp/live_parts.b64
          for i in $(seq -w 0 16); do curl -fsSL --retry 4 --retry-delay 3 "$base/app/part${i}?v=${GITHUB_SHA}" >> /tmp/live_parts.b64; done
          for i in 17 18 19 20; do curl -fsSL --retry 4 --retry-delay 3 "$base/app/fix${i}?v=${GITHUB_SHA}" >> /tmp/live_parts.b64; done
          tr -d '\r\n ' < /tmp/live_parts.b64 | base64 -d | gzip -dc > /tmp/live_app.html
      - name: Execute V78 regression against live app
        run: python scripts/assert_v78_uid_pair_current_squad.py /tmp/live_app.html | tee _v78_live_proof.txt
      - name: Record live proof
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _v78_live_proof.txt
          git commit -m 'Record V78 live import proof' || true
          git pull --rebase origin main
          git push
