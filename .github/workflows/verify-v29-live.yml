name: Verify V30 live
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check V30 JavaScript syntax
        run: |
          node --check sessionrpcbridge.js
          node --check newsdiffbridge.js
          node --check servermanagerscoreclientv1.js
          node --check captainpointsdisplay.js
      - name: Wait for V30 on public Pages
        shell: bash
        run: |
          set -euo pipefail
          base='https://tek091009-lab.github.io/FM-Fantasy'
          ok=0
          for attempt in $(seq 1 72); do
            stamp="${GITHUB_SHA}-${attempt}-$(date +%s)"
            idx="$(curl -fsSL --max-time 20 "$base/index.html?v=$stamp" || true)"
            rpc="$(curl -fsSL --max-time 20 "$base/sessionrpcbridge.js?v=$stamp" || true)"
            scorer="$(curl -fsSL --max-time 20 "$base/servermanagerscoreclientv1.js?v=$stamp" || true)"
            news="$(curl -fsSL --max-time 20 "$base/newsdiffbridge.js?v=$stamp" || true)"
            if printf '%s' "$idx" | grep -q 'fm-deploy-v30-server-authoritative-manager-scoring-news-auth' \
              && printf '%s' "$idx" | grep -q 'sessionrpcbridge.js?v=1' \
              && printf '%s' "$idx" | grep -q 'servermanagerscoreclientv1.js?v=1' \
              && printf '%s' "$idx" | grep -q 'newsdiffbridge.js?v=3' \
              && ! printf '%s' "$idx" | grep -q 'worldscorefix.js' \
              && ! printf '%s' "$idx" | grep -q 'worldscorerauthv3.js' \
              && printf '%s' "$rpc" | grep -q 'session-rpc-bridge-v1-persisted-auth-jwt' \
              && printf '%s' "$scorer" | grep -q 'server-manager-score-client-v1-authoritative-rpc' \
              && printf '%s' "$news" | grep -q 'news-diff-bridge-v3-shared-session-rpc'; then
              ok=1
              break
            fi
            sleep 5
          done
          [ "$ok" -eq 1 ] || { echo 'V30 did not become live in time' >&2; exit 1; }
      - name: Record verified V30
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v30
          cat > /tmp/v30/live.json <<JSON
          {
            "verified_live_sha": "${GITHUB_SHA}",
            "verified_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "version": "v30-server-authoritative-manager-scoring-news-auth",
            "manager_scoring": "server authoritative RPC; world-advance database trigger for future imports",
            "current_world_dry_run": "Kian 66, TKFantasy 30, apply=false",
            "transfer_news": "shared persisted authenticated JWT -> last-import read-only diff RPC; current diff count 24",
            "manual_world_or_manager_mutation": "none"
          }
          JSON
          content="$(base64 -w0 /tmp/v30/live.json)"
          old="$(gh api repos/${GITHUB_REPOSITORY}/contents/.deploy/v30-live.json?ref=main --jq .sha 2>/dev/null || true)"
          if [ -n "$old" ]; then
            gh api --method PUT repos/${GITHUB_REPOSITORY}/contents/.deploy/v30-live.json -f message="Record verified V30 live" -f content="$content" -f sha="$old" -f branch=main >/dev/null
          else
            gh api --method PUT repos/${GITHUB_REPOSITORY}/contents/.deploy/v30-live.json -f message="Record verified V30 live" -f content="$content" -f branch=main >/dev/null
          fi
