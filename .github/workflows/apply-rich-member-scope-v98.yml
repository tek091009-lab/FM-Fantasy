name: Apply rich member source scope v98
on:
  push:
    branches: [main]
    paths:
      - 'scripts/upgrade_rich_member_scope_v98.py'
      - '.github/workflows/apply-rich-member-scope-v98.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Apply and capture V98 result
        id: apply
        shell: bash
        run: |
          set +e
          python scripts/upgrade_rich_member_scope_v98.py > _v98_apply_log.txt 2>&1
          rc=$?
          echo "exit_code=$rc" >> _v98_apply_log.txt
          cat _v98_apply_log.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Verify packed importer source scope
        if: steps.apply.outputs.rc == '0'
        run: |
          python - <<'PY'
          import base64,gzip,re
          from pathlib import Path
          parts=[Path('app')/f'part{i:02d}' for i in range(17)]+[Path('app')/f'fix{i}' for i in range(17,21)]
          html=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts))).decode()
          m=re.search(r'const FM_PY_SOURCE_B64\s*=\s*"([^"]+)"',html);assert m
          py=base64.b64decode(m.group(1)).decode();compile(py,'fm_importer.py','exec')
          for s in ["def _rich_is_retained_match_member(name:str):","('.scm','.apm','.pkm')","non_retained_members_skipped","unlabelled_rich_non_retained_member_names"]: assert s in py,s
          assert "if not _rich_is_retained_match_member(name):" in py
          print('V98 source-scope verification passed')
          PY
      - name: Commit result or failure log
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _v98_apply_log.txt
          if [ "${{ steps.apply.outputs.rc }}" = "0" ]; then git add app/part* app/fix*; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply V98 retained match source scope result'
          git push
      - name: Fail if patch failed
        if: steps.apply.outputs.rc != '0'
        run: exit 1
