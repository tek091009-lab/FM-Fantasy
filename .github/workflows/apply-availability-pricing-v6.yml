name: Apply availability and pricing v6

on:
  push:
    paths:
      - 'scripts/patch_availability_pricing_v1.py'
      - '.github/workflows/apply-availability-pricing-v6.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch production bundle
        run: python scripts/patch_availability_pricing_v1.py
      - name: Verify bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,re
          parts=[Path('app')/f'part{i:02d}' for i in range(17)]+[Path('app')/f'fix{i}' for i in range(17,21)]
          html=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts))).decode()
          m=re.search(r'const FM_PY_SOURCE_B64\s*=\s*"([^"]+)"',html)
          py=base64.b64decode(m.group(1)).decode()
          required=['_structural_availability_from_fs','injury_manager.dat','discipline.dat','fpl-shaped-v6-position-distribution-calibrated','position_price_rank','expected_return_date','suspension_games_remaining']
          missing=[x for x in required if x not in py and x not in html]
          if missing:raise SystemExit('missing '+repr(missing))
          assert "elif pos=='MID':" in py
          assert "else: # FWD" in py
          assert "elif pos=='DEF':" in py
          assert "elif pos=='GK':" in py
          print('availability + all-position pricing checks passed')
          PY
      - name: Commit production bundle
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/part* app/fix*
          git commit -m 'Decode FM availability and calibrate all-position pricing' || exit 0
          git push
