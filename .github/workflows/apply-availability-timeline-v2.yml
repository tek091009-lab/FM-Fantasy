# apply corrected embedded-Python timeline patch and always record the result
name: Apply availability timeline v2
on:
  push:
    paths:
      - '.github/workflows/apply-availability-timeline-v2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify importer patch
        shell: bash
        run: |
          set +e
          python scripts/upgrade_availability_timeline_v1.py > /tmp/apply.out 2>&1
          rc=$?
          {
            echo "apply_rc=$rc"
            cat /tmp/apply.out
          } > _availability_apply_result.txt
          if [ "$rc" -eq 0 ]; then
            python - <<'PY' >> _availability_apply_result.txt 2>&1
          from pathlib import Path
          import base64,gzip,re
          parts=[Path('app')/f'part{i:02d}' for i in range(17)]+[Path('app')/f'fix{i}' for i in range(17,21)]
          html=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts))).decode('utf-8')
          m=re.search(r'const FM_PY_SOURCE_B64\s*=\s*"([^"]+)"',html)
          assert m,'embedded importer missing'
          py=base64.b64decode(m.group(1)).decode('utf-8')
          for t in ['structural-v2-fixture-floor','fixture_floor','full<=save_date','expiry<=save_date']:
              assert t in py,'missing '+t
          print('availability timeline v2 verified')
          PY
            verify_rc=$?
          else
            verify_rc=99
          fi
          echo "verify_rc=$verify_rc" >> _availability_apply_result.txt
          exit 0
      - name: Commit result and production bundle if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _availability_apply_result.txt app/part00 app/part01 app/part02 app/part03 app/part04 app/part05 app/part06 app/part07 app/part08 app/part09 app/part10 app/part11 app/part12 app/part13 app/part14 app/part15 app/part16 app/fix17 app/fix18 app/fix19 app/fix20
          git commit -m 'Record structural availability timeline v2 application' || exit 0
          git push
