name: Apply current squad UID pair v78
on:
  push:
    paths:
      - 'scripts/fix_current_squad_uid_pair_v78.py'
      - '.github/workflows/apply-current-squad-uid-pair-v78.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/fix_current_squad_uid_pair_v78.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/part* app/fix*
          git commit -m 'Apply V78 current-team UID-pair fallback' || true
          git pull --rebase origin main
          git push
