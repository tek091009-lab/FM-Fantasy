# rerun after fixing embedded-module test harness
name: Production preflight v70
on:
  push:
    paths:
      - '.github/workflows/preflight-v70.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic preflight
        run: python scripts/final_preflight_v70.py
      - name: Record exact result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _preflight_v70.json
          git commit -m 'Record V70 production preflight' || exit 0
          git pull --rebase origin main
          git push
