name: Verify retained-name history recovery v106

on:
  push:
    branches: [automation/history-v100-fixture-conditioned-names]
    paths:
      - 'scripts/upgrade_history_confirmed_name_anchor_v99.py'
      - 'scripts/upgrade_history_name_transfer_support_v100.py'
      - 'scripts/upgrade_history_confirmed_name_one_side_v101.py'
      - 'scripts/upgrade_history_confirmed_name_global_constraint_v102.py'
      - 'scripts/upgrade_history_fixture_conditioned_name_pair_v103.py'
      - 'scripts/upgrade_history_fixture_conditioned_name_global_v104.py'
      - 'scripts/upgrade_history_canonical_name_alias_v105.py'
      - 'scripts/upgrade_history_confirmed_name_cohort_v106.py'
      - '.github/workflows/verify-history-name-v106.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply retained-name decoder stack to packed importer
        run: |
          python scripts/upgrade_history_confirmed_name_anchor_v99.py
          python scripts/upgrade_history_name_transfer_support_v100.py
          python scripts/upgrade_history_confirmed_name_one_side_v101.py
          python scripts/upgrade_history_confirmed_name_global_constraint_v102.py
          python scripts/upgrade_history_fixture_conditioned_name_pair_v103.py
          python scripts/upgrade_history_fixture_conditioned_name_global_v104.py
          python scripts/upgrade_history_canonical_name_alias_v105.py
          python scripts/upgrade_history_confirmed_name_cohort_v106.py
      - name: Verify compiled importer and v106 safety invariants
        run: |
          python - <<'PY'
          import base64,gzip,re
          from pathlib import Path
          root=Path('.')
          parts=[root/'app'/f'part{i:02d}' for i in range(17)]+[root/'app'/f'fix{i}' for i in range(17,21)]
          html=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts))).decode()
          m=re.search(r'const FM_PY_SOURCE_B64\s*=\s*"([^"]+)"',html); assert m
          py=base64.b64decode(m.group(1)).decode(); compile(py,'fm_importer.py','exec')
          required=[
            'confirmed_retained_name_side_cohorts=collections.defaultdict(list)',
            'def _retained_side_name_set(rows):',
            'def confirmed_name_cohort_club(rows,ids):',
            'best_shared>=8 and best_frac>=0.38',
            'top[0]-second[0]<3 and top[1]-second[1]<0.15',
            'confirmed_retained_name_side_seen.add(_nsig)',
            'def confirmed_name_cohort_fixture_pass():',
            'def confirmed_name_cohort_one_side_pass():',
            "register_match(ci,f,rev,leid,reid,'unlabelled_retained_confirmed_name_cohort_fixture_v106')",
            "register_match(ci,f,rev,leid,reid,'unlabelled_retained_confirmed_name_cohort_one_side_v106')",
            'u=confirmed_name_cohort_fixture_pass()',
            'v=confirmed_name_cohort_one_side_pass()',
            'unlabelled_rich_confirmed_name_cohort_fixture_matches',
            'def confirmed_name_fixture_conditioned_global_pass():',
            'def confirmed_name_fixture_conditioned_pair_pass():',
            'def confirmed_name_global_constraint_pass():',
            'def confirmed_name_one_side_pass():',
            'def confirmed_roster_global_constraint_pass():',
          ]
          for s in required: assert s in py,s
          # Cohorts may only be learned inside accepted register_match() processing.
          reg=py.index('def register_match(')
          learn=py.index('confirmed_retained_name_side_seen.add(_nsig)')
          assert learn>reg
          # No fuzzy name or score-only matching was introduced.
          for forbidden in ['levenshtein','difflib','SequenceMatcher','fuzzywuzzy']:
              assert forbidden not in py
          print('v99-v106 retained-name stack compiles; v106 uses confirmed whole-side name cohorts and authoritative fixture registration')
          PY
