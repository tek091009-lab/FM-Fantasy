name: Apply V79 strict current roster fix
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_strict_current_roster_v79.py'
      - '.github/workflows/apply-v79-strict-roster.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_strict_current_roster_v79.py
      - name: Commit packed importer
        run: |
          set -e
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/part00 app/part01 app/part02 app/part03 app/part04 app/part05 app/part06 app/part07 app/part08 app/part09 app/part10 app/part11 app/part12 app/part13 app/part14 app/part15 app/part16 app/fix17 app/fix18 app/fix19 app/fix20
          git commit -m 'Apply V79 strict current roster policy' || exit 0
          git push
