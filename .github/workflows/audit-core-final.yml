# final re-run after normalization
name: Final core availability audit
on:
  push:
    paths:
      - '.github/workflows/audit-core-final.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit current production bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,json,re
          parts=[Path('app')/f'part{i:02d}' for i in range(17)]+[Path('app')/f'fix{i}' for i in range(17,21)]
          html=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts))).decode('utf-8')
          decls=[
            'function fmAvailabilityTruthDate(payload){',
            'function fmAvailabilityTruthStale(payload){',
            'function fmInferActiveSuspensions(payload){',
            'function fmInferActiveInjuries(payload){'
          ]
          counts={d:html.count(d) for d in decls}
          start=html.find('function fmAvailabilityTruthDate(payload){')
          end=html.find('function fmBuildInitialNews(payload){',start)
          block=html[start:end] if start>=0 and end>start else ''
          m=re.search(r'const FM_PY_SOURCE_B64\s*=\s*"([^"]+)"',html)
          py=base64.b64decode(m.group(1)).decode('utf-8') if m else ''
          result={
            'counts':counts,
            'block_found':bool(block),
            'direct_tokens':{t:(t in block) for t in ['fmAvailabilityTruthStale','discipline.dat/active-ban-v1','injury_manager.dat/current-window']},
            'forbidden':{t:(t in block) for t in ['5 yellow cards','second-yellow red','fmClubPlayedAfter(payload,p.club,inc.date)']},
            'python_tokens':{t:(t in py) for t in ['structural-v2-fixture-floor','fixture_floor','full<=save_date','expiry<=save_date']},
          }
          result['ok']=all(v==1 for v in counts.values()) and result['block_found'] and all(result['direct_tokens'].values()) and not any(result['forbidden'].values()) and all(result['python_tokens'].values())
          Path('_core_final_audit.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - name: Commit audit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _core_final_audit.json
          git commit -m 'Record final normalized core availability audit' || exit 0
          git push
