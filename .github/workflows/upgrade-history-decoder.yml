name: Upgrade history decoder

on:
  push:
    branches:
      - history-decoder-v53
    paths:
      - scripts/upgrade_history_decoder.py
      - scripts/history_recovery_v53.pyfrag
      - .github/workflows/upgrade-history-decoder.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: history-decoder-v53
      - name: Patch embedded importer
        run: python scripts/upgrade_history_decoder.py
      - name: Verify generated app changed
        run: |
          git status --short
          git diff --check
          test -n "$(git status --short app/)"
      - name: Commit upgraded production bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/part* app/fix*
          git commit -m "Upgrade importer retained-history decoder"
          git push origin HEAD:history-decoder-v53
