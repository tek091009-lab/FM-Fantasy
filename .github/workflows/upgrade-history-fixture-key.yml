name: Upgrade history fixture identity

on:
  push:
    branches:
      - main
    paths:
      - scripts/upgrade_history_decoder.py
      - scripts/history_recovery_v53.pyfrag
      - .github/workflows/upgrade-history-fixture-key.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch embedded importer
        run: python scripts/upgrade_history_decoder.py
      - name: Verify generated app changed
        run: |
          git status --short
          git diff --check
          test -n "$(git status --short app/)"
      - name: Commit repaired production bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/part* app/fix*
          git commit -m "Repair recursive fixture identity in production importer"
          git push origin HEAD:main
