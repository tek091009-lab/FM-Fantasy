name: Upgrade variable retained squad sizes v64
on:
  push:
    branches: [main]
    paths:
      - 'scripts/upgrade_history_variable_squads_v64.py'
      - '.github/workflows/upgrade-history-variable-squads-v64.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch embedded importer
        run: python scripts/upgrade_history_variable_squads_v64.py
      - name: Verify generated importer
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path('scripts/history_recovery_v53.pyfrag').read_text()
          assert '_rich_candidate_squad_pairs(stats,played_score_pairs)' in s
          assert 'variable_squad_size_candidate_pairs' in s
          assert 'played_score_pairs' in s
          print('variable retained squad-size checks passed')
          PY
      - name: Commit production upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/history_recovery_v53.pyfrag app/part* app/fix*
          git commit -m "Add variable retained squad-size recovery"
          git push origin HEAD:main
