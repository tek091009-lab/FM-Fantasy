name: Inspect transfer bank logic
on:
  push:
    paths:
      - '.github/workflows/inspect-transfer-bank.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and inspect
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,re
          parts=[Path('app')/f'part{i:02d}' for i in range(17)]+[Path('app')/f'fix{i}' for i in range(17,21)]
          html=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts))).decode('utf-8')
          lines=html.splitlines()
          needles=['function addPlayer','function removePlayer','function transferChanges','state.bank','lockedSquad','Confirm Transfers','confirmTransfers','resetTransfers','Clear Draft','function save()','squadValue','Budget']
          for n in needles:
            print('\n===== '+n+' =====')
            hits=[i for i,l in enumerate(lines) if n.lower() in l.lower()]
            print('hits',len(hits))
            for i in hits[:20]:
              for j in range(max(0,i-8),min(len(lines),i+18)): print(f'{j+1:05d}: {lines[j]}')
              print('---')
          PY
