name: Diagnose Pages workflow runs
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-pages-runs.yml']
permissions:
  contents: write
  actions: read
  pages: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture workflows and recent runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          mkdir -p .deploy
          {
            echo '--- workflows ---'
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" --jq '.workflows[] | [.id,.name,.path,.state] | @tsv'
            echo '--- recent pages deployments ---'
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" --jq '.workflow_runs[] | select((.name|ascii_downcase|contains("page")) or (.path|ascii_downcase|contains("page"))) | [.id,.name,.path,.head_sha,.status,.conclusion,.event,.created_at,.updated_at] | @tsv' | head -50
          } > .deploy/pages-runs.txt 2>&1
          git config user.name github-actions[bot]
          git config user.email 4189824+github-actions[bot]@users.noreply.github.com
          git add .deploy/pages-runs.txt
          git commit -m "Record Pages workflow diagnostic ${GITHUB_SHA::7}"
          git pull --rebase origin main
          git push
