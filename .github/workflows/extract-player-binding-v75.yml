name: Extract player binding v75
on:
  push:
    paths:
      - 'scripts/extract_player_binding_v75.py'
      - '.github/workflows/extract-player-binding-v75.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/extract_player_binding_v75.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189822+github-actions[bot]@users.noreply.github.com'
          git add _player_binding_v75.txt
          git commit -m 'Record player binding v75' || true
          git pull --rebase origin main
          git push
