name: Extract current V79 importer
on:
  push:
    branches: [main]
    paths:
      - 'scripts/extract_current_v79.py'
      - '.github/workflows/extract-current-v79.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/extract_current_v79.py
      - name: Commit extraction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _current_importer_v79.txt
          git commit -m 'Record current V79 importer' || exit 0
          git push
