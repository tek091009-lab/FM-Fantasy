name: Inspect player price model
on:
  push:
    paths:
      - '.github/workflows/inspect-price-model.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect decoded pricing and position logic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,re
          parts=[Path('app')/f'part{i:02d}' for i in range(17)]+[Path('app')/f'fix{i}' for i in range(17,21)]
          html=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts))).decode('utf-8')
          m=re.search(r'const FM_PY_SOURCE_B64\s*=\s*"([^"]+)"',html)
          py=base64.b64decode(m.group(1)).decode('utf-8') if m else ''
          lines=py.splitlines()
          needles=['zero_minute_exception','position_price_rank','distribution_cap','raw_scores','def infer','pos=','position','played_position','minutes_by','role','nailedness','observed_matches']
          seen=set()
          for n in needles:
            hits=[i for i,l in enumerate(lines) if n.lower() in l.lower()]
            if not hits: continue
            print('\n===== '+n+f' ({len(hits)}) =====')
            for i in hits[:25]:
              a=max(0,i-8);b=min(len(lines),i+16);key=(a,b)
              if key in seen: continue
              seen.add(key)
              for j in range(a,b): print(f'{j+1:05d}: {lines[j]}')
              print('---')
          PY
