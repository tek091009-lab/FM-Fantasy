name: Apply V76 Pages gate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-pages-gate-v76.yml'
      - 'scripts/upgrade_pages_gate_v76.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Upgrade Pages workflow
        run: python scripts/upgrade_pages_gate_v76.py
      - name: Verify workflow text
        run: |
          grep -q 'assert_v76_snapshot_boundary.py' .github/workflows/pages.yml
          grep -q 'snapshotdate.js?v=1' .github/workflows/pages.yml
          grep -q 'v76-dated-append-only-snapshot-live' .github/workflows/pages.yml
      - name: Commit Pages workflow
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/pages.yml
          git commit -m "Gate Pages on V76 dated append-only snapshots"
          git push
