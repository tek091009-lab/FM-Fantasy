name: Strip embedded old FM guards v84
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strip-embedded-old-guards-v84.yml'
      - 'scripts/strip_embedded_old_guards_v84.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  strip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/strip_embedded_old_guards_v84.py
      - name: Commit cleaned packed app
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 4189824+github-actions[bot]@users.noreply.github.com
          git add app/part* app/fix*
          git commit -m "Remove embedded legacy import guards v84"
          git pull --rebase origin main
          git push
