name: Upgrade current squad block consensus v74
on:
  push:
    paths:
      - 'scripts/upgrade_current_squad_block_consensus_v74.py'
      - '.github/workflows/upgrade-current-squad-block-consensus-v74.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify v74
        shell: bash
        run: |
          set -e
          python scripts/upgrade_current_squad_block_consensus_v74.py
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,re,sys,types
          parts=[Path('app')/f'part{i:02d}' for i in range(17)]+[Path('app')/f'fix{i}' for i in range(17,21)]
          h=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts))).decode()
          m=re.search(r'const FM_PY_SOURCE_B64\s*=\s*"([^"]+)"',h);assert m
          py=base64.b64decode(m.group(1)).decode();compile(py,'fm_importer_v74.py','exec')
          for t in ['ambiguous_squad_blocks','consensus_squad_blocks','v74-require-current-db-block-consensus-no-heuristic-tiebreak','current-squad-validated-shift-v73']:
              assert t in py,t
          assert 'chosen=choose_options(eid,options)' in py
          print('v74 verify ok')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/part00 app/part01 app/part02 app/part03 app/part04 app/part05 app/part06 app/part07 app/part08 app/part09 app/part10 app/part11 app/part12 app/part13 app/part14 app/part15 app/part16 app/fix17 app/fix18 app/fix19 app/fix20
          git commit -m 'Require current squad block consensus v74' || true
          git pull --rebase origin main
          git push
