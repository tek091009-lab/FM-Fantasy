name: Deploy FM Fantasy to GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - 'deploy-marker.json'
      - '.deploy/**'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run core regressions
        run: |
          node scripts/test_season_publish_v84.js
          node scripts/test_squad_registration_policy_v3.js
          if [ -f scripts/test_weekly_boundary_v12.js ]; then node scripts/test_weekly_boundary_v12.js; fi
      - name: Check current JavaScript syntax
        run: |
          node --check sessionrpcbridge.js
          node --check newsdiffbridge.js
          node --check servermanagerscoreclientv1.js
          node --check managerstateauthorityv1.js
          node --check captainpointsdisplay.js
      - name: Verify packed importer compiles
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,re
          parts=[Path('app')/f'part{i:02d}' for i in range(17)]+[Path('app')/f'fix{i}' for i in range(17,21)]
          html=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts))).decode('utf-8')
          m=re.search(r'const FM_PY_SOURCE_B64\s*=\s*"([^"]+)"',html); assert m,'embedded importer missing'
          py=base64.b64decode(m.group(1)).decode('utf-8'); compile(py,'live_importer.py','exec')
          assert 'browser_build_payload_from_fs' in py
          assert 'v82-current-db-consensus-only-ability-non-authoritative' in py
          print('packed importer compiles')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify V30 public deployment
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          ok=0
          for attempt in $(seq 1 60); do
            stamp="${GITHUB_SHA}-${attempt}-$(date +%s)"
            idx="$(curl -fsSL --max-time 20 "$base/index.html?v=$stamp" || true)"
            rpc="$(curl -fsSL --max-time 20 "$base/sessionrpcbridge.js?v=$stamp" || true)"
            scorer="$(curl -fsSL --max-time 20 "$base/servermanagerscoreclientv1.js?v=$stamp" || true)"
            news="$(curl -fsSL --max-time 20 "$base/newsdiffbridge.js?v=$stamp" || true)"
            if printf '%s' "$idx" | grep -q 'fm-deploy-v30-server-authoritative-manager-scoring-news-auth' \
              && printf '%s' "$idx" | grep -q 'sessionrpcbridge.js?v=1' \
              && printf '%s' "$idx" | grep -q 'servermanagerscoreclientv1.js?v=1' \
              && printf '%s' "$idx" | grep -q 'newsdiffbridge.js?v=3' \
              && ! printf '%s' "$idx" | grep -q 'worldscorefix.js' \
              && ! printf '%s' "$idx" | grep -q 'worldscorerauthv3.js' \
              && printf '%s' "$rpc" | grep -q 'session-rpc-bridge-v1-persisted-auth-jwt' \
              && printf '%s' "$scorer" | grep -q 'server-manager-score-client-v1-authoritative-rpc' \
              && printf '%s' "$news" | grep -q 'news-diff-bridge-v3-shared-session-rpc'; then
              ok=1; break
            fi
            sleep 5
          done
          [ "$ok" -eq 1 ] || { echo 'V30 did not become live' >&2; exit 1; }
      - name: Record verified V30 deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > /tmp/marker.json <<JSON
          {
            "verified_live_sha": "${GITHUB_SHA}",
            "verified_at": "${stamp}",
            "verification": "v30-server-authoritative-manager-scoring-news-auth",
            "manager_scoring": "server-authoritative-rpc plus world completed-gameweek advance trigger",
            "current_world_scoring_dry_run": "Kian 66; TKFantasy 30; no writes",
            "transfer_news_current_fallback": "24 proven last-import arrivals via authenticated read-only diff",
            "registration_news": "canonical registration-news-v5 renderer",
            "captain_display": "viewed-manager-context-v2",
            "update_guard": "v11-club-matched-history-repair",
            "weekly_history_boundary": "canonical-through-previous-completed-gameweek-v12",
            "manual_world_or_manager_mutation": "none"
          }
          JSON
          content="$(base64 -w0 /tmp/marker.json)"
          existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/deploy-marker.json?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$existing_sha" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/deploy-marker.json" -f message="Record verified V30 deployment ${GITHUB_SHA::7}" -f content="$content" -f sha="$existing_sha" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/deploy-marker.json" -f message="Record verified V30 deployment ${GITHUB_SHA::7}" -f content="$content" -f branch=main >/dev/null
          fi
