name: Deploy FM Fantasy to GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - 'deploy-marker.json'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preflight clean-rebuild importer safety
        shell: bash
        run: |
          set -euo pipefail
          python scripts/final_preflight_v70.py
          python - <<'PY'
          import json
          r=json.load(open('_preflight_v70.json'))
          assert r.get('ok') is True,r
          assert r['checks'].get('header_pat_runtime_object') is True,r
          assert r['checks'].get('name_pool_runtime_probe') is True,r
          print('deterministic V71 clean-rebuild preflight passed')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Deep-verify live FM Fantasy build
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          ok=0
          for attempt in $(seq 1 12); do
            body="$(curl -fsSL --max-time 20 "$base/index.html?sha=${GITHUB_SHA}" || true)"
            if printf '%s' "$body" | grep -q 'authfix.js?v=12' \
              && printf '%s' "$body" | grep -q 'availabilitytruth.js?v=4' \
              && printf '%s' "$body" | grep -q 'updateguard.js?v=3' \
              && printf '%s' "$body" | grep -q 'clearfix.js?v=3' \
              && printf '%s' "$body" | grep -q 'identityguard.js?v=3' \
              && printf '%s' "$body" | grep -q 'worldscorefix.js?v=5'; then
              ok=1;break
            fi
            sleep 5
          done
          [ "$ok" -eq 1 ] || { echo 'Live index did not expose clean-rebuild scripts' >&2; exit 1; }

          updateguard="$(curl -fsSL --max-time 20 "$base/updateguard.js?v=3&sha=${GITHUB_SHA}")"
          clearfix="$(curl -fsSL --max-time 20 "$base/clearfix.js?v=3&sha=${GITHUB_SHA}")"
          availability="$(curl -fsSL --max-time 20 "$base/availabilitytruth.js?v=4&sha=${GITHUB_SHA}")"
          identity="$(curl -fsSL --max-time 20 "$base/identityguard.js?v=3&sha=${GITHUB_SHA}")"
          printf '%s' "$updateguard" | grep -q 'world-update-guard-v3-identity-history-safe'
          printf '%s' "$updateguard" | grep -q 'retained matches do not reproduce the official score'
          printf '%s' "$clearfix" | grep -q 'fmfantasy_reset_world_season'
          printf '%s' "$clearfix" | grep -q 'fmFantasyLastSeasonResetBackup'
          printf '%s' "$clearfix" | grep -q 'clearBrowserManagerSeason'
          printf '%s' "$clearfix" | grep -q 'resetLeagueSnapshots'
          printf '%s' "$availability" | grep -q 'availability-truth-v4'
          printf '%s' "$availability" | grep -q 'discipline.dat/active-ban-v1'
          printf '%s' "$identity" | grep -q 'diagnostic-only'

          : > /tmp/live_parts.b64
          for i in $(seq -w 0 16); do curl -fsSL --max-time 20 "$base/app/part${i}?sha=${GITHUB_SHA}" >> /tmp/live_parts.b64; done
          for i in 17 18 19 20; do curl -fsSL --max-time 20 "$base/app/fix${i}?sha=${GITHUB_SHA}" >> /tmp/live_parts.b64; done
          tr -d '\r\n ' < /tmp/live_parts.b64 | base64 -d | gzip -dc > /tmp/live_app.html
          python - <<'PY'
          from pathlib import Path
          import base64,re,sys,types
          html=Path('/tmp/live_app.html').read_text(encoding='utf-8')
          m=re.search(r'const FM_PY_SOURCE_B64\s*=\s*"([^"]+)"',html);assert m,'live embedded importer missing'
          py=base64.b64decode(m.group(1)).decode('utf-8')
          required=['strict_current_db_membership_only_v68','strict-db-membership-only-no-history-mutation-v68','v68_current-squad-authority_previous-gws-quarantined','def _rich_candidate_twenty_pairs','named_header_candidate_v69','official-score-plus-strict-current-cohort-v69','rich_fixture_coverage','same_match_both_clubs','HEADER_PAT=re.compile']
          forbidden=["cur.extend(add);diag['rich_augmented_players']+=len(add)",'if played_club.get(eid) in clubs: ceid=played_club[eid]','infer_hybrid_positions_from_match_markers(rich,players_by_eid)',"candidates=[f for f in candidates if f['home_score']==m['home_score'] and f['away_score']==m['away_score']] or candidates",'bounded 18-22 rows per side']
          for t in required:assert t in py,'live importer missing '+t
          for t in forbidden:assert t not in py,'live importer contains forbidden '+t
          code=compile(py,'fm_importer_live.py','exec')
          name='fm_importer_live_probe';mod=types.ModuleType(name);mod.__file__='fm_importer_live.py';sys.modules[name]=mod
          exec(code,mod.__dict__,mod.__dict__)
          assert hasattr(mod.__dict__.get('HEADER_PAT'),'finditer'),'live HEADER_PAT runtime object missing'
          assert callable(mod.__dict__.get('find_name_pool_index')),'live find_name_pool_index missing'
          try:
              mod.__dict__['find_name_pool_index'](b'\x00'*4096)
          except RuntimeError as e:
              assert 'FM name string table not found' in str(e),e
          except NameError as e:
              raise AssertionError('live name-pool runtime dependency unresolved') from e
          else:
              raise AssertionError('synthetic empty DB unexpectedly resolved a live name pool')
          for t in ['structural-v2-fixture-floor','fixture_floor','full<=save_date','expiry<=save_date']:assert t in py,'live availability importer missing '+t
          start=html.find('function fmAvailabilityTruthDate(payload){');end=html.find('function fmBuildInitialNews(payload){',start)
          assert start>=0 and end>start,'live core availability block missing'
          block=html[start:end]
          for t in ['discipline.dat/active-ban-v1','injury_manager.dat/current-window']:assert t in block,'live availability missing '+t
          for t in ['5 yellow cards','second-yellow red','fmClubPlayedAfter(payload,p.club,inc.date)']:assert t not in block,'live heuristic remains '+t
          print('deep live V71 reset-safe clean-rebuild verification passed')
          PY
      - name: Record verified live deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          json="$(printf '{\n  \"verified_live_sha\": \"%s\",\n  \"verified_at\": \"%s\",\n  \"verification\": \"v71-name-pool-runtime-clean-rebuild-live\",\n  \"authfix\": \"v12-authoritative-cloud\",\n  \"availability_truth\": \"v4-direct-structural-evidence\",\n  \"current_squad_identity\": \"v68-strict-db-membership-only\",\n  \"retained_match_validation\": \"v69-official-score-plus-current-cohort\",\n  \"name_pool_runtime\": \"v71-historical-header-pat-restored-and-executed\",\n  \"update_guard\": \"v3-identity-history-safe\",\n  \"clear_database\": \"v3-backed-up-reset-plus-stale-manager-wipe\",\n  \"server_history_lock\": \"accepted-gameweeks-immutable\",\n  \"server_price_history_lock\": \"accepted-price-events-immutable\",\n  \"identity_guard\": \"v3-diagnostic-only\",\n  \"world_scorer\": \"v5-chip-persistence\"\n}\n' "$GITHUB_SHA" "$stamp")"
          content="$(printf '%s' "$json" | base64 -w0)"
          existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/deploy-marker.json?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$existing_sha" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/deploy-marker.json" -f message="Record verified v71 Pages deployment ${GITHUB_SHA::7}" -f content="$content" -f sha="$existing_sha" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/deploy-marker.json" -f message="Record verified v71 Pages deployment ${GITHUB_SHA::7}" -f content="$content" -f branch=main >/dev/null
          fi
