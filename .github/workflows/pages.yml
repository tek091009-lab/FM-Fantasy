name: Deploy FM Fantasy to GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - 'deploy-marker.json'
      - '.deploy/**'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify current season/update guard behavior
        run: node scripts/test_season_publish_v84.js
      - name: Verify packed importer compiles
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,re
          parts=[Path('app')/f'part{i:02d}' for i in range(17)]+[Path('app')/f'fix{i}' for i in range(17,21)]
          html=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts))).decode('utf-8')
          m=re.search(r'const FM_PY_SOURCE_B64\s*=\s*"([^"]+)"',html); assert m,'embedded importer missing'
          py=base64.b64decode(m.group(1)).decode('utf-8'); compile(py,'live_importer.py','exec')
          assert 'browser_build_payload_from_fs' in py
          assert 'if len(stats)<36:continue' in py
          assert 'range(18,23)' in py
          assert 'v82-current-db-consensus-only-ability-non-authoritative' in py
          print('current packed importer compiles and includes V82/V81 recovery paths')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed current importer and auth-safe rollback shell
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          ok=0
          for attempt in $(seq 1 36); do
            idx="$(curl -fsSL --max-time 20 "$base/index.html?sha=${GITHUB_SHA}-${attempt}" || true)"
            entry="$(curl -fsSL --max-time 20 "$base/v84.html?sha=${GITHUB_SHA}-${attempt}" || true)"
            guard="$(curl -fsSL --max-time 20 "$base/updateguard.js?sha=${GITHUB_SHA}-${attempt}" || true)"
            compat="$(curl -fsSL --max-time 20 "$base/importcompat.js?sha=${GITHUB_SHA}-${attempt}" || true)"
            pricing="$(curl -fsSL --max-time 20 "$base/dynamicpricingv13.js?sha=${GITHUB_SHA}-${attempt}" || true)"
            dbcontrols="$(curl -fsSL --max-time 20 "$base/dbcontrols.js?sha=${GITHUB_SHA}-${attempt}" || true)"
            undo="$(curl -fsSL --max-time 20 "$base/undoimport.js?sha=${GITHUB_SHA}-${attempt}" || true)"
            clearflow="$(curl -fsSL --max-time 20 "$base/clearflowv2.js?sha=${GITHUB_SHA}-${attempt}" || true)"
            if printf '%s' "$idx" | grep -q 'fm-deploy-auth-safe-v3' \
              && printf '%s' "$idx" | grep -q 'updateguard.js?v=9' \
              && printf '%s' "$idx" | grep -q 'importcompat.js?v=4' \
              && printf '%s' "$idx" | grep -q 'dynamicpricingv13.js?v=14' \
              && printf '%s' "$idx" | grep -q 'dbcontrols.js?v=6' \
              && printf '%s' "$idx" | grep -q 'undoimport.js?v=4' \
              && printf '%s' "$idx" | grep -q 'clearflowv2.js?v=6' \
              && printf '%s' "$entry" | grep -q 'bootstrap=v84-20260818' \
              && printf '%s' "$guard" | grep -q 'world-update-guard-v9-history-aware-season-catchup' \
              && printf '%s' "$compat" | grep -q 'import-compat-v84-season-plus-36-row' \
              && printf '%s' "$pricing" | grep -q 'dynamic-market-pricing-v14-sustained-successful-updates' \
              && printf '%s' "$dbcontrols" | grep -q 'Undo Last Import' \
              && printf '%s' "$undo" | grep -q 'undo-last-import-v2-dbcontrols-owned' \
              && printf '%s' "$clearflow" | grep -q 'creator-clear-v5-auth-safe-no-undo-observer' \
              && ! printf '%s' "$clearflow" | grep -q 'MutationObserver'; then
              ok=1; break
            fi
            sleep 5
          done
          [ "$ok" -eq 1 ] || { echo 'Live Pages did not expose the auth-safe import/pricing/undo shell' >&2; exit 1; }
      - name: Record current Pages deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > /tmp/marker.json <<JSON
          {
            "verified_live_sha": "${GITHUB_SHA}",
            "verified_at": "${stamp}",
            "verification": "v14-pricing-undo-auth-safe-v3",
            "update_guard": "v9-history-aware-season-catchup",
            "import_compat": "v84-season-plus-36-row",
            "dynamic_pricing": "v14-sustained-successful-updates",
            "undo_import": "server-backup-restore-v2-auth-safe",
            "current_squad_decoder": "v82-consensus-only",
            "retained_history": "v81-36-row-plus-variable-squad",
            "snapshot_boundary": "append-only-by-snapshot-date-v1"
          }
          JSON
          content="$(base64 -w0 /tmp/marker.json)"
          existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/deploy-marker.json?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$existing_sha" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/deploy-marker.json" -f message="Record verified auth-safe Pages deployment ${GITHUB_SHA::7}" -f content="$content" -f sha="$existing_sha" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/deploy-marker.json" -f message="Record verified auth-safe Pages deployment ${GITHUB_SHA::7}" -f content="$content" -f branch=main >/dev/null
          fi
