name: Deploy FM Fantasy to GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - 'deploy-marker.json'
      - '.deploy/**'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run core regressions
        run: |
          node scripts/test_season_publish_v84.js
          node scripts/test_squad_registration_policy_v3.js
          node scripts/test_news_persistence_v7.js
          node scripts/test_news_refresh_manager_state_v8.js
          node scripts/test_core_integrity_v33.js
          if [ -f scripts/test_weekly_boundary_v12.js ]; then node scripts/test_weekly_boundary_v12.js; fi
          python scripts/test_news_aesthetic_v34.py
      - name: Check current JavaScript syntax
        run: |
          node --check sessionrpcbridge.js
          node --check publishscorebarrier.js
          node --check transferintegrityguard.js
          node --check transferrolloverguard.js
          node --check newsdiffbridge.js
          node --check newsview.js
          node --check newsaestheticv34.js
          node --check cloudapply.js
          node --check newspersistencev5.js
          node --check newsworldrecovery.js
          node --check managerauthoritative.js
          node --check servermanagerscoreclientv1.js
          node --check managerstateauthorityv1.js
          node --check captainpointsdisplay.js
      - name: Verify packed importer compiles
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,re
          parts=[Path('app')/f'part{i:02d}' for i in range(17)]+[Path('app')/f'fix{i}' for i in range(17,21)]
          html=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts))).decode('utf-8')
          m=re.search(r'const FM_PY_SOURCE_B64\s*=\s*"([^"]+)"',html); assert m,'embedded importer missing'
          py=base64.b64decode(m.group(1)).decode('utf-8'); compile(py,'live_importer.py','exec')
          assert 'browser_build_payload_from_fs' in py
          assert 'v82-current-db-consensus-only-ability-non-authoritative' in py
          print('packed importer compiles')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify V34 public deployment
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          ok=0
          for attempt in $(seq 1 60); do
            stamp="${GITHUB_SHA}-${attempt}-$(date +%s)"
            idx="$(curl -fsSL --max-time 20 "$base/index.html?v=$stamp" || true)"
            persist="$(curl -fsSL --max-time 20 "$base/newspersistencev5.js?v=$stamp" || true)"
            view="$(curl -fsSL --max-time 20 "$base/newsview.js?v=$stamp" || true)"
            aesthetic="$(curl -fsSL --max-time 20 "$base/newsaestheticv34.js?v=$stamp" || true)"
            recover="$(curl -fsSL --max-time 20 "$base/newsworldrecovery.js?v=$stamp" || true)"
            cloud="$(curl -fsSL --max-time 20 "$base/cloudapply.js?v=$stamp" || true)"
            manager="$(curl -fsSL --max-time 20 "$base/managerauthoritative.js?v=$stamp" || true)"
            session="$(curl -fsSL --max-time 20 "$base/sessionrpcbridge.js?v=$stamp" || true)"
            barrier="$(curl -fsSL --max-time 20 "$base/publishscorebarrier.js?v=$stamp" || true)"
            transfer="$(curl -fsSL --max-time 20 "$base/transferintegrityguard.js?v=$stamp" || true)"
            rollover="$(curl -fsSL --max-time 20 "$base/transferrolloverguard.js?v=$stamp" || true)"
            if printf '%s' "$idx" | grep -q 'fm-deploy-v34-news-six-card-layout' \
              && printf '%s' "$idx" | grep -q 'newsaestheticv34.js?v=1' \
              && printf '%s' "$idx" | grep -q 'sessionrpcbridge.js?v=2' \
              && printf '%s' "$idx" | grep -q 'publishscorebarrier.js?v=2' \
              && printf '%s' "$idx" | grep -q 'managerauthoritative.js?v=4' \
              && printf '%s' "$idx" | grep -q 'transferintegrityguard.js?v=2' \
              && printf '%s' "$idx" | grep -q 'transferrolloverguard.js?v=1' \
              && printf '%s' "$aesthetic" | grep -q 'news-aesthetic-v34-six-equal-cards' \
              && printf '%s' "$aesthetic" | grep -q 'grid-template-columns:repeat(2,minmax(0,1fr))' \
              && printf '%s' "$aesthetic" | grep -q 'grid-template-rows:repeat(3,minmax(0,1fr))' \
              && ! printf '%s' "$aesthetic" | grep -q 'FMCloud' \
              && ! printf '%s' "$aesthetic" | grep -q 'publishWorld' \
              && ! printf '%s' "$aesthetic" | grep -q 'managerState' \
              && printf '%s' "$persist" | grep -q 'news-persistence-v7-import-news-authority' \
              && printf '%s' "$persist" | grep -q 'active_statuses:active' \
              && printf '%s' "$view" | grep -q 'news-view-v6-payload-aware-clear-state' \
              && printf '%s' "$recover" | grep -q 'news-world-recovery-v1-canonical-payload-authority' \
              && printf '%s' "$cloud" | grep -q 'cloud-apply-v2-canonical-world-beats-stale-clear-flag' \
              && printf '%s' "$manager" | grep -q 'manager-authoritative-v3-critical-state-integrity' \
              && printf '%s' "$manager" | grep -q 'restoreWorldDerivedState(worldDerived)' \
              && printf '%s' "$session" | grep -q 'session-rpc-bridge-v2-authenticated-supabase-client' \
              && printf '%s' "$barrier" | grep -q 'publish-score-barrier-v2-score-before-import-completes' \
              && printf '%s' "$barrier" | grep -q 'fmfantasy_undo_last_import' \
              && printf '%s' "$barrier" | grep -q 'loadWorld?.(true)' \
              && printf '%s' "$transfer" | grep -q 'transfer-integrity-guard-v2-locked-squad-authority' \
              && printf '%s' "$transfer" | grep -q 'st.lockedSquad=clone(st.squad)' \
              && printf '%s' "$rollover" | grep -q 'transfer-rollover-guard-v1-boundary-only'; then
              ok=1; break
            fi
            sleep 5
          done
          [ "$ok" -eq 1 ] || { echo 'V34 did not become live' >&2; exit 1; }
      - name: Record verified V34 deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > /tmp/marker.json <<JSON
          {
            "verified_live_sha": "${GITHUB_SHA}",
            "verified_at": "${stamp}",
            "verification": "v34-news-six-card-layout",
            "database_import": "V33 canonical import and weekly scoring protections retained unchanged",
            "team_state": "V33 manager squad, locked baseline, bank, gameweek, points and FT protections retained unchanged",
            "transfers": "V33 transfer integrity protections retained unchanged",
            "leagues": "V33 authoritative manager and league sync retained unchanged",
            "weekly_import": "V33 publish-score barrier and safe rollback retained unchanged",
            "undo": "V33 controlled rollback retained unchanged",
            "news": "six existing News sections render as two equal columns by three equal rows; View all is header-visible whenever a section contains data",
            "presentation_scope": "newsaestheticv34.js is DOM/CSS only and does not read or mutate FMCloud, manager state, imports, scoring, transfers or persistence",
            "regressions": "V33 core suite plus packed News DOM, dynamic registration-card insertion, V34 syntax and presentation-only source guard"
          }
          JSON
          content="$(base64 -w0 /tmp/marker.json)"
          existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/deploy-marker.json?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$existing_sha" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/deploy-marker.json" -f message="Record verified V34 deployment ${GITHUB_SHA::7}" -f content="$content" -f sha="$existing_sha" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/deploy-marker.json" -f message="Record verified V34 deployment ${GITHUB_SHA::7}" -f content="$content" -f branch=main >/dev/null
          fi
