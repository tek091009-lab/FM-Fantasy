name: Deploy FM Fantasy to GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - 'deploy-marker.json'
      - '.deploy/**'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run core regressions
        run: |
          node scripts/test_season_publish_v84.js
          node scripts/test_squad_registration_policy_v3.js
          if [ -f scripts/test_weekly_boundary_v12.js ]; then node scripts/test_weekly_boundary_v12.js; fi
      - name: Check current JavaScript syntax
        run: |
          node --check sessionrpcbridge.js
          node --check newsdiffbridge.js
          node --check newspersistencev2.js
          node --check servermanagerscoreclientv1.js
          node --check managerstateauthorityv1.js
          node --check captainpointsdisplay.js
      - name: Verify packed importer compiles
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,re
          parts=[Path('app')/f'part{i:02d}' for i in range(17)]+[Path('app')/f'fix{i}' for i in range(17,21)]
          html=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts))).decode('utf-8')
          m=re.search(r'const FM_PY_SOURCE_B64\s*=\s*"([^"]+)"',html); assert m,'embedded importer missing'
          py=base64.b64decode(m.group(1)).decode('utf-8'); compile(py,'live_importer.py','exec')
          assert 'browser_build_payload_from_fs' in py
          assert 'v82-current-db-consensus-only-ability-non-authoritative' in py
          print('packed importer compiles')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify V32.4 public deployment
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          ok=0
          for attempt in $(seq 1 60); do
            stamp="${GITHUB_SHA}-${attempt}-$(date +%s)"
            idx="$(curl -fsSL --max-time 20 "$base/index.html?v=$stamp" || true)"
            persist="$(curl -fsSL --max-time 20 "$base/newspersistencev2.js?v=$stamp" || true)"
            news="$(curl -fsSL --max-time 20 "$base/newsdiffbridge.js?v=$stamp" || true)"
            if printf '%s' "$idx" | grep -q 'fm-deploy-v32-4-refresh-safe-news-persistence' \
              && printf '%s' "$idx" | grep -q 'newspersistencev2.js?v=4' \
              && printf '%s' "$idx" | grep -q 'newsdiffbridge.js?v=4' \
              && printf '%s' "$persist" | grep -q 'news-persistence-v4-refresh-safe-import-only' \
              && printf '%s' "$persist" | grep -q 'news_snapshot_v1' \
              && printf '%s' "$persist" | grep -q 'commitWindowUntil' \
              && printf '%s' "$persist" | grep -q '__fmCanonicalPublishWrapped' \
              && printf '%s' "$news" | grep -q 'news-diff-bridge-v4-public-readonly-rpc'; then
              ok=1; break
            fi
            sleep 5
          done
          [ "$ok" -eq 1 ] || { echo 'V32.4 did not become live' >&2; exit 1; }
      - name: Record verified V32.4 deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > /tmp/marker.json <<JSON
          {
            "verified_live_sha": "${GITHUB_SHA}",
            "verified_at": "${stamp}",
            "verification": "v32-4-refresh-safe-news-persistence",
            "news_persistence": "final state.news plus rendered News DOM captured only after a successful import and restored locally after refresh once the real world payload is present",
            "news_change_policy": "startup/refresh/focus/render/normal manager saves cannot delete or replace committed News; only the next successful import changes it; clear database deletes it",
            "transfer_news": "server BEFORE-update canonical transfer-news trigger plus public read-only current-import fallback",
            "manager_scoring": "server-authoritative completed-gameweek trigger",
            "weekly_history_boundary": "canonical-through-previous-completed-gameweek-v12"
          }
          JSON
          content="$(base64 -w0 /tmp/marker.json)"
          existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/deploy-marker.json?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$existing_sha" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/deploy-marker.json" -f message="Record verified V32.4 deployment ${GITHUB_SHA::7}" -f content="$content" -f sha="$existing_sha" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/deploy-marker.json" -f message="Record verified V32.4 deployment ${GITHUB_SHA::7}" -f content="$content" -f branch=main >/dev/null
          fi
