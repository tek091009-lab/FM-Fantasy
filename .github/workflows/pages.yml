name: Deploy FM Fantasy to GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - 'deploy-marker.json'
      - '.deploy/**'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run core regressions
        run: |
          node scripts/test_season_publish_v84.js
          node scripts/test_squad_registration_policy_v3.js
          node scripts/test_news_persistence_v7.js
          if [ -f scripts/test_weekly_boundary_v12.js ]; then node scripts/test_weekly_boundary_v12.js; fi
      - name: Check current JavaScript syntax
        run: |
          node --check sessionrpcbridge.js
          node --check newsdiffbridge.js
          node --check newsview.js
          node --check cloudapply.js
          node --check newspersistencev5.js
          node --check newsworldrecovery.js
          node --check servermanagerscoreclientv1.js
          node --check managerstateauthorityv1.js
          node --check captainpointsdisplay.js
      - name: Verify packed importer compiles
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,re
          parts=[Path('app')/f'part{i:02d}' for i in range(17)]+[Path('app')/f'fix{i}' for i in range(17,21)]
          html=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts))).decode('utf-8')
          m=re.search(r'const FM_PY_SOURCE_B64\s*=\s*"([^"]+)"',html); assert m,'embedded importer missing'
          py=base64.b64decode(m.group(1)).decode('utf-8'); compile(py,'live_importer.py','exec')
          assert 'browser_build_payload_from_fs' in py
          assert 'v82-current-db-consensus-only-ability-non-authoritative' in py
          print('packed importer compiles')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify V32.7 public deployment
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          ok=0
          for attempt in $(seq 1 60); do
            stamp="${GITHUB_SHA}-${attempt}-$(date +%s)"
            idx="$(curl -fsSL --max-time 20 "$base/index.html?v=$stamp" || true)"
            persist="$(curl -fsSL --max-time 20 "$base/newspersistencev5.js?v=$stamp" || true)"
            view="$(curl -fsSL --max-time 20 "$base/newsview.js?v=$stamp" || true)"
            recover="$(curl -fsSL --max-time 20 "$base/newsworldrecovery.js?v=$stamp" || true)"
            cloud="$(curl -fsSL --max-time 20 "$base/cloudapply.js?v=$stamp" || true)"
            if printf '%s' "$idx" | grep -q 'fm-deploy-v32-7-news-lifecycle-authority' \
              && printf '%s' "$idx" | grep -q 'newsview.js?v=6' \
              && printf '%s' "$idx" | grep -q 'newspersistencev5.js?v=7' \
              && printf '%s' "$idx" | grep -q 'newsworldrecovery.js?v=1' \
              && ! printf '%s' "$idx" | grep -q 'newspersistencev4.js?v=6' \
              && printf '%s' "$persist" | grep -q 'news-persistence-v7-import-news-authority' \
              && printf '%s' "$persist" | grep -q 'active_statuses:active' \
              && printf '%s' "$persist" | grep -q 'recoverFromPayload' \
              && printf '%s' "$view" | grep -q 'news-view-v6-payload-aware-clear-state' \
              && printf '%s' "$view" | grep -q 'if(hasPayload()){markActive();return false}' \
              && printf '%s' "$recover" | grep -q 'news-world-recovery-v1-canonical-payload-authority' \
              && printf '%s' "$recover" | grep -q 'FMCloud.loadWorld(true)' \
              && printf '%s' "$cloud" | grep -q 'cloud-apply-v2-canonical-world-beats-stale-clear-flag'; then
              ok=1; break
            fi
            sleep 5
          done
          [ "$ok" -eq 1 ] || { echo 'V32.7 did not become live' >&2; exit 1; }
      - name: Record verified V32.7 deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > /tmp/marker.json <<JSON
          {
            "verified_live_sha": "${GITHUB_SHA}",
            "verified_at": "${stamp}",
            "verification": "v32-7-news-lifecycle-authority",
            "news_clear_lifecycle": "a non-null canonical FM world automatically removes stale clear markers; the News clear observer is forbidden from wiping sections while a real payload exists",
            "news_persistence": "state.news, state.activeStatuses, global NEWS and rendered News DOM are persisted for the imported database; season injury/suspension News can be rebuilt directly from the imported player availability payload even without a prior snapshot",
            "news_refresh_policy": "refresh immediately restores the matching imported News model and cannot be blocked by a capture window or payload_version; late native rerenders are guarded",
            "news_world_recovery": "canonical world loading deliberately ignores a stale local clear marker so a successful import cannot be hidden on the next refresh",
            "news_regression_test": "verifies full active-status persistence, payload recovery hooks, payload-aware clear handling and canonical-world stale-clear recovery",
            "transfer_news": "server BEFORE-update canonical transfer-news trigger plus public read-only current-import fallback",
            "manager_scoring": "server-authoritative completed-gameweek trigger",
            "weekly_history_boundary": "canonical-through-previous-completed-gameweek-v12"
          }
          JSON
          content="$(base64 -w0 /tmp/marker.json)"
          existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/deploy-marker.json?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$existing_sha" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/deploy-marker.json" -f message="Record verified V32.7 deployment ${GITHUB_SHA::7}" -f content="$content" -f sha="$existing_sha" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/deploy-marker.json" -f message="Record verified V32.7 deployment ${GITHUB_SHA::7}" -f content="$content" -f branch=main >/dev/null
          fi
