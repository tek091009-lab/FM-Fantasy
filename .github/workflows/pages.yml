name: Deploy FM Fantasy to GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - 'deploy-marker.json'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preflight clean-rebuild importer safety
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,re
          parts=[Path('app')/f'part{i:02d}' for i in range(17)]+[Path('app')/f'fix{i}' for i in range(17,21)]
          html=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts))).decode('utf-8')
          m=re.search(r'const FM_PY_SOURCE_B64\s*=\s*"([^"]+)"',html);assert m,'embedded importer missing'
          py=base64.b64decode(m.group(1)).decode('utf-8')
          required=[
            'strict_current_db_membership_only_v68',
            'strict-db-membership-only-no-history-mutation-v68',
            'v68_current-squad-authority_previous-gws-quarantined',
            'def _rich_candidate_twenty_pairs',
            'named_header_candidate_v69',
            'official-score-plus-strict-current-cohort-v69',
            'rich_fixture_coverage',
            'same_match_both_clubs',
            "if calc_h!=int(fix.get('home_score') or 0) or calc_a!=int(fix.get('away_score') or 0):return None",
            "if not (11<=len(home_rows)<=25 and 11<=len(away_rows)<=25):return None",
          ]
          forbidden=[
            "cur.extend(add);diag['rich_augmented_players']+=len(add)",
            'if played_club.get(eid) in clubs: ceid=played_club[eid]',
            'infer_hybrid_positions_from_match_markers(rich,players_by_eid)',
            "candidates=[f for f in candidates if f['home_score']==m['home_score'] and f['away_score']==m['away_score']] or candidates",
            'bounded 18-22 rows per side',
          ]
          for token in required:assert token in py,'missing strict importer token: '+token
          for token in forbidden:assert token not in py,'forbidden legacy importer token remains: '+token
          compile(py,'fm_importer_preflight.py','exec')
          ns={'__name__':'fm_importer_preflight'};exec(compile(py,'fm_importer_preflight.py','exec'),ns,ns)
          assert callable(ns.get('_rich_candidate_twenty_pairs'))
          def row(pid,off):return {'player_id':pid,'offset':off,'goals':0,'own_goals':0}
          left=[row(i+1,i*100) for i in range(20)];right=[row(101+i,5000+i*100) for i in range(20)]
          pairs=ns['_rich_candidate_twenty_pairs'](left+right)
          assert pairs and len(pairs[0][0])==20 and len(pairs[0][1])==20,'20x20 retained block candidate test failed'
          for token in ['structural-v2-fixture-floor','fixture_floor','full<=save_date','expiry<=save_date']:
              assert token in py,'availability importer missing '+token
          start=html.find('function fmAvailabilityTruthDate(payload){');end=html.find('function fmBuildInitialNews(payload){',start)
          assert start>=0 and end>start,'core availability block missing'
          block=html[start:end]
          for token in ['discipline.dat/active-ban-v1','injury_manager.dat/current-window']:assert token in block,'availability core missing '+token
          for token in ['5 yellow cards','second-yellow red','fmClubPlayedAfter(payload,p.club,inc.date)']:assert token not in block,'heuristic availability remains: '+token
          ug=Path('updateguard.js').read_text();cf=Path('clearfix.js').read_text();idx=Path('index.html').read_text()
          assert 'world-update-guard-v3-identity-history-safe' in ug
          assert 'fmfantasy_reset_world_season' in cf and 'fmFantasyLastSeasonResetBackup' in cf
          for token in ['availabilitytruth.js?v=4','updateguard.js?v=3','clearfix.js?v=2']:assert token in idx,'index cache version missing '+token
          print('clean-rebuild preflight passed')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Deep-verify live FM Fantasy build
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          ok=0
          for attempt in $(seq 1 12); do
            body="$(curl -fsSL --max-time 20 "$base/index.html?sha=${GITHUB_SHA}" || true)"
            if printf '%s' "$body" | grep -q 'authfix.js?v=12' \
              && printf '%s' "$body" | grep -q 'availabilitytruth.js?v=4' \
              && printf '%s' "$body" | grep -q 'updateguard.js?v=3' \
              && printf '%s' "$body" | grep -q 'canonicalpublish.js?v=1' \
              && printf '%s' "$body" | grep -q 'clearfix.js?v=2' \
              && printf '%s' "$body" | grep -q 'identityguard.js?v=3' \
              && printf '%s' "$body" | grep -q 'worldscorefix.js?v=5' \
              && printf '%s' "$body" | grep -q 'draftrecovery.js?v=2'; then
              ok=1;break
            fi
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then echo 'Live index did not expose the clean-rebuild scripts.' >&2;exit 1;fi

          auth="$(curl -fsSL --max-time 20 "$base/authfix.js?v=12&sha=${GITHUB_SHA}")"
          availability="$(curl -fsSL --max-time 20 "$base/availabilitytruth.js?v=4&sha=${GITHUB_SHA}")"
          updateguard="$(curl -fsSL --max-time 20 "$base/updateguard.js?v=3&sha=${GITHUB_SHA}")"
          clearfix="$(curl -fsSL --max-time 20 "$base/clearfix.js?v=2&sha=${GITHUB_SHA}")"
          identity="$(curl -fsSL --max-time 20 "$base/identityguard.js?v=3&sha=${GITHUB_SHA}")"
          scorer="$(curl -fsSL --max-time 20 "$base/worldscorefix.js?v=5&sha=${GITHUB_SHA}")"
          printf '%s' "$auth" | grep -q 'fmFantasyWorldVersion'
          printf '%s' "$availability" | grep -q 'availability-truth-v4'
          printf '%s' "$availability" | grep -q 'discipline.dat/active-ban-v1'
          printf '%s' "$updateguard" | grep -q 'world-update-guard-v3-identity-history-safe'
          printf '%s' "$updateguard" | grep -q 'retained matches do not reproduce the official score'
          printf '%s' "$clearfix" | grep -q 'fmfantasy_reset_world_season'
          printf '%s' "$clearfix" | grep -q 'fmFantasyLastSeasonResetBackup'
          printf '%s' "$identity" | grep -q 'diagnostic-only'
          printf '%s' "$scorer" | grep -q 'reconcileUsedChips'

          : > /tmp/live_parts.b64
          for i in $(seq -w 0 16); do curl -fsSL --max-time 20 "$base/app/part${i}?sha=${GITHUB_SHA}" >> /tmp/live_parts.b64; done
          for i in 17 18 19 20; do curl -fsSL --max-time 20 "$base/app/fix${i}?sha=${GITHUB_SHA}" >> /tmp/live_parts.b64; done
          tr -d '\r\n ' < /tmp/live_parts.b64 | base64 -d | gzip -dc > /tmp/live_app.html
          python - <<'PY'
          from pathlib import Path
          import base64,re
          html=Path('/tmp/live_app.html').read_text(encoding='utf-8')
          m=re.search(r'const FM_PY_SOURCE_B64\s*=\s*"([^"]+)"',html);assert m,'live embedded importer missing'
          py=base64.b64decode(m.group(1)).decode('utf-8')
          required=['strict_current_db_membership_only_v68','strict-db-membership-only-no-history-mutation-v68','def _rich_candidate_twenty_pairs','official-score-plus-strict-current-cohort-v69','rich_fixture_coverage',"if calc_h!=int(fix.get('home_score') or 0) or calc_a!=int(fix.get('away_score') or 0):return None"]
          forbidden=["cur.extend(add);diag['rich_augmented_players']+=len(add)",'if played_club.get(eid) in clubs: ceid=played_club[eid]','infer_hybrid_positions_from_match_markers(rich,players_by_eid)','bounded 18-22 rows per side']
          for token in required:assert token in py,'live importer missing '+token
          for token in forbidden:assert token not in py,'live importer contains forbidden '+token
          compile(py,'fm_importer_live.py','exec')
          for token in ['structural-v2-fixture-floor','fixture_floor','full<=save_date','expiry<=save_date']:assert token in py,'live importer missing '+token
          declarations=['function fmAvailabilityTruthDate(payload){','function fmAvailabilityTruthStale(payload){','function fmInferActiveSuspensions(payload){','function fmInferActiveInjuries(payload){']
          for d in declarations:assert html.count(d)==1,f'live core expected exactly one {d}, got {html.count(d)}'
          start=html.find('function fmAvailabilityTruthDate(payload){');end=html.find('function fmBuildInitialNews(payload){',start);assert start>=0 and end>start
          block=html[start:end]
          for token in ['discipline.dat/active-ban-v1','injury_manager.dat/current-window']:assert token in block
          for token in ['5 yellow cards','second-yellow red','fmClubPlayedAfter(payload,p.club,inc.date)']:assert token not in block
          print('deep live clean-rebuild verification passed')
          PY
      - name: Record verified live deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          json="$(printf '{\n  \"verified_live_sha\": \"%s\",\n  \"verified_at\": \"%s\",\n  \"verification\": \"v69-clean-rebuild-live-preflight-and-postdeploy\",\n  \"authfix\": \"v12-authoritative-cloud\",\n  \"availability_truth\": \"v4-direct-structural-evidence\",\n  \"current_squad_identity\": \"v68-strict-db-membership-only\",\n  \"retained_match_validation\": \"v69-official-score-plus-current-cohort\",\n  \"update_guard\": \"v3-identity-history-safe\",\n  \"clear_database\": \"v2-backed-up-season-reset\",\n  \"server_history_lock\": \"accepted-gameweeks-immutable\",\n  \"server_price_history_lock\": \"accepted-price-events-immutable\",\n  \"identity_guard\": \"v3-diagnostic-only\",\n  \"world_scorer\": \"v5-chip-persistence\"\n}\n' "$GITHUB_SHA" "$stamp")"
          content="$(printf '%s' "$json" | base64 -w0)"
          existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/deploy-marker.json?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$existing_sha" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/deploy-marker.json" -f message="Record verified v69 Pages deployment ${GITHUB_SHA::7}" -f content="$content" -f sha="$existing_sha" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/deploy-marker.json" -f message="Record verified v69 Pages deployment ${GITHUB_SHA::7}" -f content="$content" -f branch=main >/dev/null
          fi
