name: Deploy FM Fantasy to GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - 'deploy-marker.json'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live FM Fantasy build
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          url="${PAGE_URL%/}/index.html?sha=${GITHUB_SHA}"
          ok=0
          for i in $(seq 1 12); do
            body="$(curl -fsSL --max-time 15 "$url" || true)"
            if printf '%s' "$body" | grep -q 'authfix.js?v=12' \
              && printf '%s' "$body" | grep -q 'availabilitytruth.js?v=1' \
              && printf '%s' "$body" | grep -q 'updateguard.js?v=2' \
              && printf '%s' "$body" | grep -q 'identityguard.js?v=3' \
              && printf '%s' "$body" | grep -q 'worldscorefix.js?v=4'; then
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo 'Live Pages smoke test did not see the authoritative weekly stability build.' >&2
            exit 1
          fi
      - name: Record verified live deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          json="$(printf '{\n  \"verified_live_sha\": \"%s\",\n  \"verified_at\": \"%s\",\n  \"authfix\": \"v12-authoritative-cloud\",\n  \"availability_truth\": \"v1-direct-current-save-only\",\n  \"update_guard\": \"v2\",\n  \"identity_guard\": \"v3-diagnostic-only\",\n  \"world_scorer\": \"v4\"\n}\n' "$GITHUB_SHA" "$stamp")"
          content="$(printf '%s' "$json" | base64 -w0)"
          existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/deploy-marker.json?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$existing_sha" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/deploy-marker.json" \
              -f message="Record verified Pages deployment ${GITHUB_SHA::7}" \
              -f content="$content" \
              -f sha="$existing_sha" \
              -f branch=main >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/deploy-marker.json" \
              -f message="Record verified Pages deployment ${GITHUB_SHA::7}" \
              -f content="$content" \
              -f branch=main >/dev/null
          fi
