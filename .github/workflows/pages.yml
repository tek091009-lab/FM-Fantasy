name: Deploy FM Fantasy to GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - 'deploy-marker.json'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preflight V76 clean-rebuild safety
        shell: bash
        run: |
          set -euo pipefail
          python scripts/final_preflight_v70.py
          python scripts/assert_fixture_db_handoff_v74.py
          python scripts/assert_v76_snapshot_boundary.py
          python - <<'PY'
          import json
          r=json.load(open('_preflight_v70.json'))
          assert r.get('ok') is True,r
          for k in ['header_pat_runtime_object','name_pool_runtime_probe','league_selector_v72','fixture_mapping_v73_runtime','update_guard_v4']:
              assert r['checks'].get(k) is True,(k,r)
          print('deterministic V76 clean-rebuild preflight passed')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Deep-verify live V76 build
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          ok=0
          for attempt in $(seq 1 18); do
            body="$(curl -fsSL --max-time 20 "$base/index.html?sha=${GITHUB_SHA}-${attempt}" || true)"
            badge="$(curl -fsSL --max-time 20 "$base/snapshotdate.js?sha=${GITHUB_SHA}-${attempt}" || true)"
            if printf '%s' "$body" | grep -q 'authfix.js?v=12' \
              && printf '%s' "$body" | grep -q 'availabilitytruth.js?v=4' \
              && printf '%s' "$body" | grep -q 'updateguard.js?v=4' \
              && printf '%s' "$body" | grep -q 'clearfix.js?v=3' \
              && printf '%s' "$body" | grep -q 'identityguard.js?v=3' \
              && printf '%s' "$body" | grep -q 'worldscorefix.js?v=5' \
              && printf '%s' "$body" | grep -q 'snapshotdate.js?v=1' \
              && printf '%s' "$badge" | grep -q 'snapshot-date-v1'; then
              ok=1; break
            fi
            sleep 5
          done
          [ "$ok" -eq 1 ] || { echo 'Live index did not expose V76 safety scripts' >&2; exit 1; }

          updateguard="$(curl -fsSL --max-time 20 "$base/updateguard.js?v=4&sha=${GITHUB_SHA}")"
          clearfix="$(curl -fsSL --max-time 20 "$base/clearfix.js?v=3&sha=${GITHUB_SHA}")"
          availability="$(curl -fsSL --max-time 20 "$base/availabilitytruth.js?v=4&sha=${GITHUB_SHA}")"
          identity="$(curl -fsSL --max-time 20 "$base/identityguard.js?v=3&sha=${GITHUB_SHA}")"
          snapshotbadge="$(curl -fsSL --max-time 20 "$base/snapshotdate.js?v=1&sha=${GITHUB_SHA}")"
          printf '%s' "$updateguard" | grep -q 'world-update-guard-v4-fixture-club-proof'
          printf '%s' "$updateguard" | grep -q 'current-squad-validated-shift-v73'
          printf '%s' "$updateguard" | grep -q 'retained matches do not reproduce the official score'
          printf '%s' "$clearfix" | grep -q 'fmfantasy_reset_world_season'
          printf '%s' "$clearfix" | grep -q 'clearBrowserManagerSeason'
          printf '%s' "$availability" | grep -q 'availability-truth-v4'
          printf '%s' "$identity" | grep -q 'diagnostic-only'
          printf '%s' "$snapshotbadge" | grep -q 'snapshot-date-v1'
          printf '%s' "$snapshotbadge" | grep -q 'FM data · '

          : > /tmp/live_parts.b64
          for i in $(seq -w 0 16); do curl -fsSL --max-time 20 "$base/app/part${i}?sha=${GITHUB_SHA}" >> /tmp/live_parts.b64; done
          for i in 17 18 19 20; do curl -fsSL --max-time 20 "$base/app/fix${i}?sha=${GITHUB_SHA}" >> /tmp/live_parts.b64; done
          tr -d '\r\n ' < /tmp/live_parts.b64 | base64 -d | gzip -dc > /tmp/live_app.html
          python scripts/assert_fixture_db_handoff_v74.py /tmp/live_app.html
          python scripts/assert_v76_snapshot_boundary.py /tmp/live_app.html
          python - <<'PY'
          from pathlib import Path
          import base64,re,sys,types
          html=Path('/tmp/live_app.html').read_text(encoding='utf-8')
          m=re.search(r'const FM_PY_SOURCE_B64\s*=\s*"([^"]+)"',html); assert m,'live embedded importer missing'
          py=base64.b64decode(m.group(1)).decode('utf-8')
          required=[
            'strict_current_db_membership_only_v68','strict-db-membership-only-no-history-mutation-v68',
            'def _rich_candidate_twenty_pairs','official-score-plus-strict-current-cohort-v69','HEADER_PAT=re.compile',
            'current-squad-validated-shift-v73','def _fixture_to_club_shift_candidates','def _fixture_shift_current_squad_evidence',
            'select_championship_fixtures(fix,all_clubs,expected_names,requested_league,db)',
            "FIXTURE_DB_HANDOFF_POLICY='loaded-game-db-bytes-v74'",
            'v75-current-db-structural-senior-resolution-no-history','_choose_current_squad_option_v75','paired_uid_v75','current_person_senior_quality_v75',
            "'snapshot_date':snapshot_date","'historical_freeze_policy':'append-only-by-snapshot-date-v1'",
            "'snapshot_date_semantics':'FM data boundary; not browser time'",
          ]
          forbidden=[
            "cur.extend(add);diag['rich_augmented_players']+=len(add)",
            'if played_club.get(eid) in clubs: ceid=played_club[eid]',
            'infer_hybrid_positions_from_match_markers(rich,players_by_eid)',
            'bounded 18-22 rows per side',
          ]
          for t in required: assert t in py,'live importer missing '+t
          for t in forbidden: assert t not in py,'live importer contains forbidden '+t
          code=compile(py,'fm_importer_live_v76.py','exec'); name='fm_importer_live_v76'; mod=types.ModuleType(name); mod.__file__='fm_importer_live_v76.py'; sys.modules[name]=mod; exec(code,mod.__dict__,mod.__dict__)
          assert hasattr(mod.__dict__.get('HEADER_PAT'),'finditer')
          try: mod.__dict__['find_name_pool_index'](b'\x00'*4096)
          except RuntimeError as e: assert 'FM name string table not found' in str(e)
          except NameError as e: raise AssertionError('live name-pool runtime dependency unresolved') from e
          else: raise AssertionError('synthetic empty DB unexpectedly resolved a name pool')
          v72=['fmFantasySeasonLeaguePreferenceV72','contains both supported English leagues','FM_PENDING_SEASON_LEAGUE=fmRememberLeaguePreference(chosen)',"return await sendFMImport(file,mode,true,chosen)"]
          for t in v72: assert t in html,'live V72 league selector missing '+t
          start=html.find('function fmAvailabilityTruthDate(payload){'); end=html.find('function fmBuildInitialNews(payload){',start); assert start>=0 and end>start
          block=html[start:end]
          for t in ['discipline.dat/active-ban-v1','injury_manager.dat/current-window']: assert t in block
          for t in ['5 yellow cards','second-yellow red','fmClubPlayedAfter(payload,p.club,inc.date)']: assert t not in block
          print('deep live V76 verification passed')
          PY
      - name: Record verified V76 deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          json="$(printf '{\n  \"verified_live_sha\": \"%s\",\n  \"verified_at\": \"%s\",\n  \"verification\": \"v76-dated-append-only-snapshot-live\",\n  \"authfix\": \"v12-authoritative-cloud\",\n  \"availability_truth\": \"v4-direct-structural-evidence\",\n  \"current_squad_decoder\": \"v75-current-db-structural-senior-resolution-no-history\",\n  \"retained_match_validation\": \"v69-official-score-plus-current-cohort\",\n  \"name_pool_runtime\": \"v71-historical-header-pat-restored-and-executed\",\n  \"league_selector\": \"v72-auto-prompt-plus-sticky-manual-choice\",\n  \"fixture_club_mapping\": \"v73-current-squad-validated-shift\",\n  \"fixture_db_handoff\": \"v74-loaded-game-db-bytes\",\n  \"snapshot_boundary\": \"append-only-by-snapshot-date-v1\",\n  \"snapshot_badge\": \"snapshot-date-v1\",\n  \"server_history_authority\": \"supabase-dated-canonical-merge\",\n  \"history_identity\": \"stable-date-fixture-context-v2\",\n  \"update_guard\": \"v4-fixture-club-proof\",\n  \"clear_database\": \"v3-backed-up-reset-plus-stale-manager-wipe\"\n}\n' "$GITHUB_SHA" "$stamp")"
          content="$(printf '%s' "$json" | base64 -w0)"
          existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/deploy-marker.json?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$existing_sha" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/deploy-marker.json" -f message="Record verified V76 Pages deployment ${GITHUB_SHA::7}" -f content="$content" -f sha="$existing_sha" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/deploy-marker.json" -f message="Record verified V76 Pages deployment ${GITHUB_SHA::7}" -f content="$content" -f branch=main >/dev/null
          fi
