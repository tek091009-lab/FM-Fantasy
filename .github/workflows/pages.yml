name: Deploy FM Fantasy to GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - 'deploy-marker.json'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Deep-verify live FM Fantasy build
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          ok=0
          for attempt in $(seq 1 12); do
            body="$(curl -fsSL --max-time 20 "$base/index.html?sha=${GITHUB_SHA}" || true)"
            if printf '%s' "$body" | grep -q 'authfix.js?v=12' \
              && printf '%s' "$body" | grep -q 'availabilitytruth.js?v=3' \
              && printf '%s' "$body" | grep -q 'updateguard.js?v=2' \
              && printf '%s' "$body" | grep -q 'canonicalpublish.js?v=1' \
              && printf '%s' "$body" | grep -q 'identityguard.js?v=3' \
              && printf '%s' "$body" | grep -q 'worldscorefix.js?v=5' \
              && printf '%s' "$body" | grep -q 'draftrecovery.js?v=2' \
              && printf '%s' "$body" | grep -q 'capabilityconsistency.js?v=1'; then
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo 'Live index did not expose the final stability scripts.' >&2
            exit 1
          fi

          auth="$(curl -fsSL --max-time 20 "$base/authfix.js?v=12&sha=${GITHUB_SHA}")"
          availability="$(curl -fsSL --max-time 20 "$base/availabilitytruth.js?v=3&sha=${GITHUB_SHA}")"
          canonical="$(curl -fsSL --max-time 20 "$base/canonicalpublish.js?v=1&sha=${GITHUB_SHA}")"
          identity="$(curl -fsSL --max-time 20 "$base/identityguard.js?v=3&sha=${GITHUB_SHA}")"
          scorer="$(curl -fsSL --max-time 20 "$base/worldscorefix.js?v=5&sha=${GITHUB_SHA}")"
          draft="$(curl -fsSL --max-time 20 "$base/draftrecovery.js?v=2&sha=${GITHUB_SHA}")"

          printf '%s' "$auth" | grep -q 'fmFantasyWorldVersion'
          printf '%s' "$auth" | grep -q 'payload_version'
          printf '%s' "$availability" | grep -q 'availability-truth-v3'
          printf '%s' "$availability" | grep -q 'discipline.dat/active-ban-v1'
          printf '%s' "$canonical" | grep -q 'canonical-publish-v1'
          printf '%s' "$identity" | grep -q 'diagnostic-only'
          printf '%s' "$scorer" | grep -q 'reconcileUsedChips'
          printf '%s' "$scorer" | grep -q "includes('triple')"
          printf '%s' "$draft" | grep -q 'ids(s.squad).length===15'

          : > /tmp/live_parts.b64
          for i in $(seq -w 0 16); do curl -fsSL --max-time 20 "$base/app/part${i}?sha=${GITHUB_SHA}" >> /tmp/live_parts.b64; done
          for i in 17 18 19 20; do curl -fsSL --max-time 20 "$base/app/fix${i}?sha=${GITHUB_SHA}" >> /tmp/live_parts.b64; done
          tr -d '\r\n ' < /tmp/live_parts.b64 | base64 -d | gzip -dc > /tmp/live_app.html
          python - <<'PY'
          from pathlib import Path
          import base64,re
          html=Path('/tmp/live_app.html').read_text(encoding='utf-8')

          # Embedded FM decoder: current timeline may never move backwards to an old injury-table date.
          m=re.search(r'const FM_PY_SOURCE_B64\s*=\s*"([^"]+)"',html)
          assert m,'live embedded importer missing'
          py=base64.b64decode(m.group(1)).decode('utf-8')
          for token in ['structural-v2-fixture-floor','fixture_floor','full<=save_date','expiry<=save_date']:
              assert token in py,'live importer missing '+token
          assert 'suspension_evidence_structural' in py
          assert 'discipline.dat/active-ban-v1' in py

          # Core JS: exactly one strict availability truth implementation and no card-count guesses.
          declarations=[
            'function fmAvailabilityTruthDate(payload){',
            'function fmAvailabilityTruthStale(payload){',
            'function fmInferActiveSuspensions(payload){',
            'function fmInferActiveInjuries(payload){'
          ]
          for d in declarations:
              assert html.count(d)==1,f'live core expected exactly one {d}, got {html.count(d)}'
          start=html.find('function fmAvailabilityTruthDate(payload){')
          end=html.find('function fmBuildInitialNews(payload){',start)
          assert start>=0 and end>start,'live core availability block missing'
          block=html[start:end]
          for token in ['fmAvailabilityTruthStale','discipline.dat/active-ban-v1','injury_manager.dat/current-window']:
              assert token in block,'live core availability missing '+token
          for forbidden in ['5 yellow cards','second-yellow red','fmClubPlayedAfter(payload,p.club,inc.date)']:
              assert forbidden not in block,'live core still contains heuristic availability logic: '+forbidden
          print('deep live stability verification passed')
          PY
      - name: Record verified live deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          json="$(printf '{\n  \"verified_live_sha\": \"%s\",\n  \"verified_at\": \"%s\",\n  \"verification\": \"deep-live-index-scripts-embedded-importer-and-core-availability\",\n  \"authfix\": \"v12-authoritative-cloud\",\n  \"availability_truth\": \"v3-direct-structural-evidence\",\n  \"core_availability_truth\": \"direct-structural-only-no-card-heuristics\",\n  \"embedded_availability_decoder\": \"structural-v2-fixture-floor\",\n  \"update_guard\": \"v2\",\n  \"canonical_publish\": \"v1\",\n  \"identity_guard\": \"v3-diagnostic-only\",\n  \"world_scorer\": \"v5-chip-persistence\",\n  \"draft_recovery\": \"v2\",\n  \"capability_consistency\": \"v1\"\n}\n' "$GITHUB_SHA" "$stamp")"
          content="$(printf '%s' "$json" | base64 -w0)"
          existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/deploy-marker.json?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$existing_sha" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/deploy-marker.json" \
              -f message="Record deeply verified Pages deployment ${GITHUB_SHA::7}" \
              -f content="$content" \
              -f sha="$existing_sha" \
              -f branch=main >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/deploy-marker.json" \
              -f message="Record deeply verified Pages deployment ${GITHUB_SHA::7}" \
              -f content="$content" \
              -f branch=main >/dev/null
          fi
