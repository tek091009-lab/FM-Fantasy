name: Upgrade Pages gate v78
on:
  push:
    paths:
      - 'scripts/upgrade_pages_gate_v78.py'
      - '.github/workflows/upgrade-pages-gate-v78.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/upgrade_pages_gate_v78.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/pages.yml
          git commit -m 'Gate Pages on V78 current-team UID-pair fallback' || true
          git pull --rebase origin main
          git push
