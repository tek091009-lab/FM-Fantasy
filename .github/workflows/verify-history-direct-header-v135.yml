name: Verify retained history payload-complete delimiters v135

on:
  push:
    branches: [automation/history-v100-fixture-conditioned-names]
    paths:
      - 'scripts/upgrade_history_compact_boundary_v122.py'
      - 'scripts/upgrade_history_contiguous_lineup_boundary_v123.py'
      - 'scripts/upgrade_history_appearance_only_sides_v124.py'
      - 'scripts/upgrade_history_unrated_bench_records_v125.py'
      - 'scripts/upgrade_history_direct_header_tid_v126.py'
      - 'scripts/upgrade_history_direct_header_orientation_v127.py'
      - 'scripts/upgrade_history_direct_header_locality_v128.py'
      - 'scripts/upgrade_history_direct_header_span_v129.py'
      - 'scripts/upgrade_history_direct_header_namespace_v130.py'
      - 'scripts/upgrade_history_header_anchored_candidate_v131.py'
      - 'scripts/upgrade_history_header_payload_boundary_v132.py'
      - 'scripts/upgrade_history_header_false_boundary_v133.py'
      - 'scripts/upgrade_history_header_fixture_delimiter_v134.py'
      - 'scripts/upgrade_history_header_payload_complete_delimiter_v135.py'
      - '.github/workflows/verify-history-direct-header-v135.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply retained structural decoder stack through v135
        run: |
          python scripts/upgrade_history_compact_boundary_v122.py
          python scripts/upgrade_history_contiguous_lineup_boundary_v123.py
          python scripts/upgrade_history_appearance_only_sides_v124.py
          python scripts/upgrade_history_unrated_bench_records_v125.py
          python scripts/upgrade_history_direct_header_tid_v126.py
          python scripts/upgrade_history_direct_header_orientation_v127.py
          python scripts/upgrade_history_direct_header_locality_v128.py
          python scripts/upgrade_history_direct_header_span_v129.py
          python scripts/upgrade_history_direct_header_namespace_v130.py
          python scripts/upgrade_history_header_anchored_candidate_v131.py
          python scripts/upgrade_history_header_payload_boundary_v132.py
          python scripts/upgrade_history_header_false_boundary_v133.py
          python scripts/upgrade_history_header_fixture_delimiter_v134.py
          python scripts/upgrade_history_header_payload_complete_delimiter_v135.py
      - name: Verify packed importer and delimiter invariants
        run: |
          python - <<'PY'
          import base64,gzip,re
          from pathlib import Path
          root=Path('.')
          parts=[root/'app'/f'part{i:02d}' for i in range(17)]+[root/'app'/f'fix{i}' for i in range(17,21)]
          html=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts))).decode()
          m=re.search(r'const FM_PY_SOURCE_B64\s*=\s*"([^\"]+)"',html);assert m
          py=base64.b64decode(m.group(1)).decode();compile(py,'fm_importer.py','exec')
          required=[
              'def _v135_header_pair_direct_target(home_id,away_id):',
              'def _v135_segment_has_complete_pair(raw,start,end):',
              'def _v135_next_safe_header(raw,headers,hi,payload_start):',
              '_v135_next_safe_header(raw,headers,hi,q+span+12)',
              'header_anchored_payload_complete_delimiters',
              'header_anchored_prepayload_false_delimiters_skipped',
              'payload_start=q+span+12',
              'if len(proposals)!=1:',
              'register_match(ci,f,rev,leid,reid,source)',
          ]
          for token in required:assert token in py,token
          assert 'if hid-ph==aid-pa:return True' not in py
          assert '_v133_next_safe_header(raw,headers,hi)' not in py

          # Behavioural invariant: a marker belonging to another competition need not itself map
          # to this league if the current bytes are already a complete retained match payload.
          # Conversely, an early metadata marker before a complete payload must be skipped.
          def choose(markers,current_complete_at,direct_target_offsets=frozenset()):
              skipped=0
              for off in markers:
                  if off in direct_target_offsets:return off,skipped,'direct'
                  if off>=current_complete_at:return off,skipped,'payload-complete'
                  skipped+=1
              return None,skipped,'none'
          assert choose([400,900],700)==(900,1,'payload-complete')
          assert choose([400,900],700,{400})==(400,0,'direct')
          assert choose([900],700)==(900,0,'payload-complete')

          # v135 may change only binary payload delimiting; authoritative match attachment remains
          # under the existing unique proposal / used-fixture / register_match gates.
          assert 'if len(proposals)!=1:' in py
          assert 'fixture_identity(f) in used_fixtures' in py
          assert 'register_match(ci,f,rev,leid,reid,source)' in py
          print('v135 compiles; completed target payloads can stop at non-league next headers without arbitrary shift guessing')
          PY
