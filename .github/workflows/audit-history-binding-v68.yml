name: Audit history binding v68
on:
  push:
    paths:
      - '.github/workflows/audit-history-binding-v68.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract importer identity/history binding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,re
          parts=[Path('app')/f'part{i:02d}' for i in range(17)]+[Path('app')/f'fix{i}' for i in range(17,21)]
          html=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts))).decode('utf-8')
          m=re.search(r'const FM_PY_SOURCE_B64\s*=\s*"([^"]+)"',html)
          if not m: raise SystemExit('FM_PY_SOURCE_B64 missing')
          py=base64.b64decode(m.group(1)).decode('utf-8')
          lines=py.splitlines()
          defs=[]
          for i,l in enumerate(lines):
            mm=re.match(r'^def\s+([A-Za-z0-9_]+)\(',l)
            if mm and any(k in mm.group(1).lower() for k in ['rich','history','player','squad','match','fixture','weekly','payload']):
              defs.append((i+1,mm.group(1)))
          needles=['def _rich_stat_record_at','player_id','weekly_points','history.append','history=','setdefault(\'history\'','rich_matches','recover_unlabelled_rich_members','squads[','squads.get(','player_map','players_by','pid_map']
          hits=[]
          for i,l in enumerate(lines):
            if any(n in l for n in needles): hits.append(i)
          keep=set()
          for i in hits:
            for j in range(max(0,i-8),min(len(lines),i+13)): keep.add(j)
          out=['DEFINITIONS']+[f'{n}: {name}' for n,name in defs]+['','CONTEXT']
          last=-99
          for i in sorted(keep):
            if i>last+1: out.append('\n---')
            out.append(f'{i+1:05d}: {lines[i]}')
            last=i
          Path('_history_binding_v68.txt').write_text('\n'.join(out)+'\n')
          print('wrote',len(out),'lines')
          PY
      - name: Commit audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _history_binding_v68.txt
          git commit -m 'Record history binding v68 audit' || exit 0
          git push
