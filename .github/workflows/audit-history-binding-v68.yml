name: Audit history binding v68
on:
  push:
    paths:
      - '.github/workflows/audit-history-binding-v68.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact importer identity/history functions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,re
          parts=[Path('app')/f'part{i:02d}' for i in range(17)]+[Path('app')/f'fix{i}' for i in range(17,21)]
          html=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts))).decode('utf-8')
          m=re.search(r'const FM_PY_SOURCE_B64\s*=\s*"([^"]+)"',html)
          if not m: raise SystemExit('FM_PY_SOURCE_B64 missing')
          py=base64.b64decode(m.group(1)).decode('utf-8')
          lines=py.splitlines()
          def body(name):
            start=next((i for i,l in enumerate(lines) if l.startswith(f'def {name}(')),None)
            if start is None:return f'### {name}\nMISSING\n'
            end=len(lines)
            for j in range(start+1,len(lines)):
              if re.match(r'^def\s+[A-Za-z0-9_]+\(',lines[j]): end=j;break
            return '### '+name+'\n'+'\n'.join(f'{i+1:05d}: {lines[i]}' for i in range(start,end))+'\n'
          names=['read_squad_list','_rich_members_by_club','scan_first_team_squads','_rich_stat_record_at','_rich_extract_member','join_rich_matches','build_players','aggregate_player_history','_build_payload','recover_unlabelled_rich_members','recover_game_db_rich_matches']
          Path('_history_binding_v68.txt').write_text('\n'.join(body(n) for n in names))
          PY
      - name: Commit audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _history_binding_v68.txt
          git commit -m 'Expand history binding v68 audit' || exit 0
          git push
