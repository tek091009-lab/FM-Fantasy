name: Inspect early rich match recovery
on:
  push:
    paths:
      - '.github/workflows/apply-role-first-v63.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract recovery source
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,re
          parts=[Path('app')/f'part{i:02d}' for i in range(17)]+[Path('app')/f'fix{i}' for i in range(17,21)]
          html=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts))).decode('utf-8','replace')
          m=re.search(r'const FM_PY_SOURCE_B64\s*=\s*"([^"]+)"',html)
          py=base64.b64decode(m.group(1)).decode('utf-8','replace')
          names=['def recover_unlabelled_rich_members','def single_side_bridge_pass','def strict_seed','def recover_game_db_rich','unlabelled_rich_cached_candidate_pairs','unlabelled_rich_unmatched_cached_pairs','def fixture_key']
          out=[]
          for needle in names:
              out.append('\n### '+needle+'\n')
              pos=py.find(needle)
              out.append(py[max(0,pos-1500):min(len(py),pos+18000)] if pos>=0 else 'NOT FOUND')
          Path('_recovery_diag.txt').write_text(''.join(out))
          PY
      - name: Commit diagnostic
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _recovery_diag.txt
          git commit -m "Inspect early rich match recovery" || exit 0
          git push
