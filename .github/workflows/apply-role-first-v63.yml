name: Inspect current pricing and position model
on:
  push:
    paths:
      - '.github/workflows/apply-role-first-v63.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract current importer model snippets
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,re
          parts=[Path('app')/f'part{i:02d}' for i in range(17)]+[Path('app')/f'fix{i}' for i in range(17,21)]
          html=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts))).decode('utf-8','replace')
          m=re.search(r'const FM_PY_SOURCE_B64\s*=\s*"([^"]+)"',html)
          py=base64.b64decode(m.group(1)).decode('utf-8','replace')
          out=[]
          for needle in ['def reprice_players','def _calibrate_observed_hybrid_positions','marker_roles','observed_midfield_usage_v63','def aggregate_player_history']:
              out.append('\n### '+needle+'\n')
              pos=py.find(needle)
              if pos>=0: out.append(py[max(0,pos-1000):min(len(py),pos+12000)])
              else: out.append('NOT FOUND')
          Path('_model_diag.txt').write_text(''.join(out))
          PY
      - name: Commit diagnostic
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _model_diag.txt
          git commit -m "Inspect current pricing and position source" || exit 0
          git push
