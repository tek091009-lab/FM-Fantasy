name: Inspect bundled News source
on:
  push:
    paths:
      - '.github/workflows/apply-role-first-v63.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract News source
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,re
          parts=[Path('app')/f'part{i:02d}' for i in range(17)]+[Path('app')/f'fix{i}' for i in range(17,21)]
          html=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts))).decode('utf-8','replace')
          needles=['Show All','View All','renderNews','NEWS','newsList','newsPanel','news']
          out=[]
          for needle in needles:
              out.append('\n### '+needle+'\n')
              for m in list(re.finditer(re.escape(needle),html,re.I))[:30]:
                  a=max(0,m.start()-700);b=min(len(html),m.end()+1400)
                  out.append(html[a:b].replace('\n',' ')+'\n---\n')
          Path('_news_bundle_diag.txt').write_text(''.join(out))
          print('diag chars',len(''.join(out)))
          PY
      - name: Commit diagnostic
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _news_bundle_diag.txt
          git commit -m "Inspect bundled News source" || exit 0
          git push
