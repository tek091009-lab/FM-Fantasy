name: Extract full embedded importer v99
on:
  push:
    branches: [main]
    paths:
      - 'scripts/extract_full_importer_v99.py'
      - '.github/workflows/extract-full-importer-v99.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/extract_full_importer_v99.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _current_full_importer_v99.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Extract current full embedded importer v99'
          git push
