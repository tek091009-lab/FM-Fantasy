name: Normalize core availability helpers
on:
  push:
    paths:
      - '.github/workflows/normalize-core-final.yml'
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize core availability block
        shell: bash
        run: |
          set -euo pipefail
          python scripts/upgrade_core_availability_truth.py
          python - <<'PY'
          from pathlib import Path
          import base64,gzip
          parts=[Path('app')/f'part{i:02d}' for i in range(17)]+[Path('app')/f'fix{i}' for i in range(17,21)]
          html=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts))).decode('utf-8')
          ds=['function fmAvailabilityTruthDate(payload){','function fmAvailabilityTruthStale(payload){','function fmInferActiveSuspensions(payload){','function fmInferActiveInjuries(payload){']
          assert all(html.count(d)==1 for d in ds),{d:html.count(d) for d in ds}
          s=html.find(ds[0]);e=html.find('function fmBuildInitialNews(payload){',s);block=html[s:e]
          assert all(t in block for t in ['discipline.dat/active-ban-v1','injury_manager.dat/current-window'])
          assert all(t not in block for t in ['5 yellow cards','second-yellow red','fmClubPlayedAfter(payload,p.club,inc.date)'])
          print('core availability block normalized exactly once')
          PY
      - name: Commit normalized production bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/part00 app/part01 app/part02 app/part03 app/part04 app/part05 app/part06 app/part07 app/part08 app/part09 app/part10 app/part11 app/part12 app/part13 app/part14 app/part15 app/part16 app/fix17 app/fix18 app/fix19 app/fix20
          git commit -m 'Normalize core availability helpers exactly once'
          git push
