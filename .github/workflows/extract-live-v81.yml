name: Extract live importer v81
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-live-v81.yml'
      - 'scripts/extract_live_importer_v81.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/extract_live_importer_v81.py
      - name: Commit exact live source snapshot
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 4189824+github-actions[bot]@users.noreply.github.com
          git add _current_importer_live_v81.py _current_import_runtime_live_v81.txt
          git commit -m "Extract exact live importer v81 snapshot"
          git pull --rebase origin main
          git push
