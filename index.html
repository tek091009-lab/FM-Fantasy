<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FM Fantasy</title><style>html,body{margin:0;width:100%;height:100%;background:#08051a;color:#fff;font-family:Inter,system-ui,sans-serif}.boot{height:100%;display:grid;place-items:center}.boot>div{text-align:center}.mark{font-size:30px;font-weight:1000}.mark span{color:#ff5cac}.bar{width:220px;height:7px;margin:18px auto 8px;border-radius:999px;background:#211940;overflow:hidden}.bar i{display:block;width:40%;height:100%;border-radius:999px;background:linear-gradient(90deg,#7429ff,#ff2d8f);animation:a 1s infinite alternate}@keyframes a{to{transform:translateX(150%)}}small{color:#a7a0c2}</style></head><body><div class="boot"><div><div class="mark">FM <span>Fantasy</span></div><div class="bar"><i></i></div><small>Loading Fantasy world…</small></div></div><script>(async()=>{try{const names=[...Array(17)].map((_,i)=>'./app/part'+String(i).padStart(2,'0')).concat(['./app/fix17','./app/fix18','./app/fix19','./app/fix20']);const txt=await Promise.all(names.map(async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('Missing '+u);return (await r.text()).trim()}));const b64=txt.join(''),bin=atob(b64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const ds=new DecompressionStream('gzip');let html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();html=html.replace('</body>','<script src="./authfix.js?v=7"><\/script><script src="./dbcontrols.js?v=3"><\/script></body>');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="boot"><div><div class="mark">FM <span>Fantasy</span></div><p>Could not load the production app.</p><small>'+String(e.message||e)+'</small></div></div>';console.error(e)}})();</script></body></html>
